<style>

color:rgba(255,255,255,.42);letter-spacing:0;text-transform:none}.nav-chev{font-size:12px;transition:transform .18s ease;color:rgba(255,255,255,.55)}.nav-group.open .nav-chev{transform:rotate(90deg);color:white}.nav-group-body{display:none;padding-top:5px}.nav-group.open .nav-group-body{display:block}.sidebar-footer{margin-top:auto;font-size:11px;color:rgba(255,255,255,.42);border-top:1px solid rgba(255,255,255,.10);padding-top:12px;line-height:1.45}.main{display:flex;flex-direction:column;height:100vh;min-width:0}.topbar{height:72px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}.top-left{min-width:0}.top-left h2{margin:0;font-size:22px}.top-left p{margin:3px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill,.select,select,input,textarea{border:1px solid var(--line);border-radius:12px;background:white;padding:10px 12px;font-size:13px;color:var(--ink)}.pill{display:inline-flex;align-items:center;gap:8px}.status-dot{width:8px;height:8px;border-radius:50%;background:#52b86a}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--green);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.small{font-size:12px;padding:7px 10px;border-radius:10px}.content{padding:22px;overflow:auto}.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.kpi-grid{grid-template-columns:repeat(4,minmax(160px,1fr));margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.kpi .value{font-size:28px;font-weight:900;margin-top:6px}.kpi .sub{color:var(--muted);font-size:12px;margin-top:3px}.span-2{grid-column:span 2}.span-3{grid-column:span 3}.module-grid{grid-template-columns:repeat(3,minmax(220px,1fr))}.module-card{cursor:pointer;transition:.15s}.module-card:hover{transform:translateY(-2px);border-color:#aad5b4}.module-card .icon{font-size:28px}.module-card h3{margin:8px 0 6px}.module-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:260px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 12px;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f7faf6;position:sticky;top:0}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.bg-green{background:var(--green2);color:var(--green)}.bg-blue{background:#e9f1fb;color:var(--blue)}.bg-amber{background:#fff4da;color:var(--amber)}.bg-red{background:#fdeaea;color:var(--red)}.bg-purple{background:#f1ebfb;color:var(--purple)}.two-col{grid-template-columns:1.25fr .75fr}.three-col{grid-template-columns:repeat(3,1fr)}.alert-list{display:flex;flex-direction:column;gap:10px}.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.alert .mark{width:10px;height:10px;border-radius:50%;background:var(--amber);margin-top:4px;flex:0 0 auto}.alert.red .mark{background:var(--red)}.alert.green .mark{background:var(--green)}.alert strong{display:block;font-size:13px}.alert span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:112px;border:1px solid var(--line);border-radius:16px;background:white;padding:10px}.day .num{font-weight:900}.event{margin-top:8px;padding:7px 8px;border-radius:10px;background:var(--green2);font-size:11px;color:var(--green);font-weight:800}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fg{display:flex;flex-direction:column;gap:5px}.fg label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(860px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:20px}.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.x{background:transparent;border:0;font-size:26px;cursor:pointer;color:var(--muted)}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px}.cat-card h4{margin:0 0 10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f3f6f2;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px}.chart-bars{height:190px;display:flex;align-items:flex-end;gap:10px}.bar{flex:1;background:linear-gradient(180deg,#5aae72,#1f6b3a);border-radius:12px 12px 0 0;min-height:12px;position:relative}.bar::after{content:attr(data-label);position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}.print-doc{font-family:Arial,sans-serif;background:white;color:#111;padding:30px;max-width:850px;margin:auto}.print-doc .doc-head{display:flex;justify-content:space-between;border-bottom:3px solid #1f6b3a;padding-bottom:14px}.print-doc h1{margin:0;color:#1f6b3a}.print-doc table{min-width:0}.hidden{display:none!important}.mobile-menu{display:none}.role-note{font-size:12px;color:var(--muted)}

.module-grid{grid-template-columns:1fr;gap:16px}
.module-map{display:flex;flex-direction:column;gap:18px}
.flow-section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.flow-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.flow-section-head h3{margin:0;font-size:17px}
.flow-section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.flow-tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;background:#f6f8f6;border:1px solid var(--line);color:var(--ink)}
.flow-track{display:flex;align-items:center;gap:8px;overflow:auto;padding:4px 2px 8px;scrollbar-width:thin}
.flow-node{min-width:168px;background:#fbfcfb;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;position:relative}
.flow-node:hover{transform:translateY(-2px);border-color:#b7d9c0;box-shadow:0 10px 18px rgba(18,50,20,.08)}
.flow-node::after{content:'';position:absolute;inset:0;border-radius:18px;border-top:3px solid var(--node-accent, #1f6b3a);opacity:.95}
.flow-node .node-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flow-node h4{margin:0;font-size:14px;line-height:1.2}
.flow-node p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.flow-arrow{position:relative;flex:0 0 34px;height:2px;background:linear-gradient(90deg,#d2ddd2,#8eb79a);border-radius:999px}
.flow-arrow::after{content:'›';position:absolute;right:-1px;top:50%;transform:translateY(-51%);font-size:18px;color:#7c9982;font-weight:900}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}
.quick-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.15s}
.quick-card:hover{transform:translateY(-2px);border-color:#b7d9c0;box-shadow:0 10px 18px rgba(18,50,20,.08)}
.quick-card h4{margin:0 0 4px;font-size:14px}.quick-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.icon-badge{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.icon-badge.small{width:32px;height:32px;border-radius:10px;font-size:16px}
.icon-badge.green{background:linear-gradient(180deg,#ecf8ef,#d8efdf);color:#1d6a39}
.icon-badge.blue{background:linear-gradient(180deg,#eef5fd,#dceaf9);color:#2463a8}
.icon-badge.amber{background:linear-gradient(180deg,#fff8e7,#ffedbf);color:#9a6500}
.icon-badge.red{background:linear-gradient(180deg,#fff0f0,#ffd9d9);color:#a12828}
.icon-badge.purple{background:linear-gradient(180deg,#f5efff,#e6d9ff);color:#6941a3}
.icon-badge.gray{background:linear-gradient(180deg,#f4f5f6,#e7eaed);color:#49535b}
.node-step{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nav button{padding:9px 10px}
.nav button .ico{width:auto;text-align:left;display:inline-flex}
.nav button .label{font-weight:700}
.nav-group-head .group-ico{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:14px}
.cat-card{position:relative;overflow:hidden;padding:15px}
.cat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat-accent,#1f6b3a)}
.cat-card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.cat-card h4{margin:0;font-size:15px}.cat-card .cat-meta{font-size:12px;color:var(--muted);margin-top:4px}
.cat-card .used-in{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.mini-chip{background:#f7f8f7;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#f3f6f2;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}
.mod-note{font-size:12px;color:var(--muted);margin-bottom:10px}
@media(max-width:1020px){.quick-grid,.catalog-grid{grid-template-columns:1fr}.flow-track{flex-direction:column;align-items:stretch}.flow-node{min-width:0}.flow-arrow{width:2px;height:18px;align-self:center;background:linear-gradient(180deg,#d2ddd2,#8eb79a)}.flow-arrow::after{content:'⌄';right:auto;left:50%;top:auto;bottom:-8px;transform:translateX(-50%);font-size:14px}.flow-section-head{margin-bottom:10px}}

@media(max-width:1020px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:80;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.kpi-grid,.module-grid,.two-col,.three-col,.catalog-grid{grid-template-columns:1fr}.topbar{height:auto;padding:14px;align-items:flex-start}.top-actions{justify-content:flex-start}.content{padding:14px}.form-grid{grid-template-columns:1fr}.search{min-width:180px}.span-2,.span-3{grid-column:auto}}
@media print{body{height:auto;overflow:visible;background:white}.app,.modal-backdrop{display:none}.print-only{display:block!important}.print-doc{display:block!important}.no-print{display:none!important}}
.clickable-card{cursor:pointer;transition:.15s}.clickable-card:hover{transform:translateY(-2px);border-color:#aad5b4}.clickable-card:active{transform:translateY(0)}.alert.clickable-card{cursor:pointer}

.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.calendar-title{font-size:20px;font-weight:900}
.calendar-actions{display:flex;gap:8px;flex-wrap:wrap}
.calendar-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.calendar-dow div{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.calendar .day{position:relative;min-height:118px}
.calendar .day.other-month{background:#f7faf6;color:#9aa7a0}
.calendar .day.today{border-color:var(--green);box-shadow:0 0 0 2px rgba(31,107,58,.12)}
.calendar .day.has-event{cursor:pointer}
.calendar .day .num{display:flex;align-items:center;justify-content:space-between;gap:6px}
.calendar .day .add-day{border:0;background:var(--green2);color:var(--green);border-radius:999px;width:24px;height:24px;font-weight:900;cursor:pointer}
.calendar .event{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar .event.job{background:#e9f1fb;color:var(--blue)}
.calendar .event.done{background:#e9f8ee;color:var(--green)}
.calendar .event.cancelled{background:#fdeaea;color:var(--red)}
.calendar-list{margin-top:16px}
.calendar-list .card h3{margin-bottom:4px}
@media(max-width:760px){
  .calendar{grid-template-columns:1fr}
  .calendar-dow{display:none}
  .calendar .day.other-month{display:none}
}


.btn.danger,.btn.small.danger{background:#b42318;color:#fff;border-color:#b42318}
.btn.danger:hover,.btn.small.danger:hover{background:#8f1d13}


/* v20 Supabase model readiness additions */
.line-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.line-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f8faf8;border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted)}
.location-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.location-card{border:1px solid var(--line);background:#fbfcfb;border-radius:12px;padding:8px;font-size:12px}
.warning-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.supabase-note{background:#eef7ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.table-wrap .btn.micro{font-size:11px;padding:5px 8px}


/* v22 archive/deactivate workflow fixed */
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.filter-row .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.filter-row .seg button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.filter-row .seg button.active{background:var(--green);color:#fff}
.status-muted{opacity:.58}
.action-note{font-size:12px;color:var(--muted);margin-top:4px}
.btn.warn,.btn.small.warn,.btn.micro.warn{background:#f59e0b;color:#fff;border-color:#f59e0b}
.btn.warn:hover,.btn.small.warn:hover,.btn.micro.warn:hover{background:#d97706}
.btn.reverse,.btn.small.reverse,.btn.micro.reverse{background:#7c3aed;color:#fff;border-color:#7c3aed}
.btn.reverse:hover,.btn.small.reverse:hover,.btn.micro.reverse:hover{background:#6d28d9}
.lifecycle-note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}


/* v23 print/email workflow */
.print-email-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.email-preview-box{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;max-height:260px;overflow:auto}
@media print{
  .sidebar,.topbar,.toolbar,.print-email-bar,.btn,.filter-row,.calendar-actions,.nav,.modal-backdrop{display:none!important}
  .main,.content,.card,.table-wrap{box-shadow:none!important;border:none!important}
  body{background:white!important}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid;page-break-after:auto}
}


/* v24 dependency drilldown */
.dep-list{display:flex;flex-direction:column;gap:10px}
.dep-group{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.dep-group h3{margin:0;padding:11px 12px;background:#f8faf8;border-bottom:1px solid var(--line);font-size:14px}
.dep-row{display:grid;grid-template-columns:1.2fr 1fr .8fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.dep-row:last-child{border-bottom:0}
.dep-row .muted{color:var(--muted);font-size:12px}
.dep-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:760px){.dep-row{grid-template-columns:1fr}.dep-actions{justify-content:flex-start}}


/* v25 Home Command Center */
.command-hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:16px}
.command-panel{background:linear-gradient(135deg,#12351f,#1f6b3a);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.command-panel::after{content:'';position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:999px;background:rgba(255,255,255,.08)}
.command-panel h2{font-size:28px;margin:0 0 8px;letter-spacing:-.03em}
.command-panel p{color:rgba(255,255,255,.78);max-width:720px;line-height:1.45;margin:0 0 16px}
.command-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.command-actions .btn{background:#fff;color:#1f6b3a;border-color:#fff;font-weight:900}
.command-actions .btn.secondary{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.health-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.health-score{display:flex;align-items:center;justify-content:space-between;gap:14px}
.score-ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--score)*1%),#e8eee8 0);display:flex;align-items:center;justify-content:center;position:relative}
.score-ring::before{content:'';position:absolute;width:76px;height:76px;border-radius:50%;background:#fff}
.score-ring span{position:relative;font-size:28px;font-weight:1000;color:var(--green)}
.health-card h3{margin:0 0 4px}
.health-card p{margin:0;color:var(--muted);font-size:13px}
.command-grid{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.command-kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 18px rgba(18,50,20,.04);cursor:pointer;transition:.15s}
.command-kpi:hover{transform:translateY(-2px);border-color:#b7d9c0;box-shadow:0 12px 22px rgba(18,50,20,.08)}

// ── 4. SUPABASE PROXY ────────────────────────────────────────
async function dbCall(action, table, payload={}) {
  try {
    const res = await fetch(DB_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, table, ...payload })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'DB error');
    return json.data;
  } catch(e) {
    return null;
  }
}

async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');

  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; return; }
  btn.textContent = 'Signing in…';
  btn.disabled    = true;
  errEl.textContent = '';

  try {
    // Try Supabase first, fall back to local users
    let user = null;
    const cloudUser = await dbCall('login', null, { data: { email, password } });
    if (cloudUser) {
      user = cloudUser;
    } else {
      user = LOCAL_USERS.find(u => u.email === email && u.password === password) || null;
    }

    if (!user) {
      errEl.textContent = 'Invalid credentials. Try again.';
      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }

    currentUser = user;
    btn.textContent = 'Loading data…';

    // Load data from Supabase, fall back to localStorage
    const cloudData = await loadFromSupabase();
    if (cloudData && cloudData.customers !== undefined) {
      db = cloudData;
      try { localStorage.setItem(storageKey, JSON.stringify(db)); } catch(e) {}
    } else {
      db = loadLocal();
    }

    // Ensure all arrays exist (safety init)
    initDbArrays();

    // Apply user preferences
    state.role = user.role || 'Admin';
    state.lang = user.language || 'en';

    // Show app, hide login
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('main-app').style.display = '';

    // Hide Local Mode pill if authenticated via Supabase
    if (cloudUser) {
      const pill = document.getElementById('local-mode-pill');
      if (pill) pill.style.display = 'none';
    }

    // Update user info in sidebar footer
    const infoEl = document.getElementById('user-info');
    if (infoEl) infoEl.textContent = `${user.name} · ${user.role}`;

    // Initialize the app
    init();

  } catch(e) {
    errEl.textContent = 'Connection error. Check your internet.';
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(storageKey);
    if (raw) {
      const data = JSON.parse(raw);
      // Merge any missing catalog keys from EMPTY_DB
      // This ensures new catalog entries appear after app updates
      if (!data.catalogs) data.catalogs = {};
      const defaultCats = EMPTY_DB.catalogs;
      Object.keys(defaultCats).forEach(k => {
        if (!data.catalogs[k]) data.catalogs[k] = [...defaultCats[k]];
      });
      return data;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(EMPTY_DB));
}

function save(data) {
  try { localStorage.setItem(storageKey, JSON.stringify(data)); } catch(e) {}
}

async function loadFromSupabase() {
  const data = await dbCall('loadAll', null);
  if (!data) return null;
  // Preserve local catalogs if Supabase returns empty catalogs
  if (!data.catalogs || Object.keys(data.catalogs).length === 0) {
    data.catalogs = EMPTY_DB.catalogs;
  }
  return data;
}

// Ensure all required arrays exist in db
function initDbArrays() {
  const arrays = ['customers','addresses','vendors','services','stores','jobs',
    'calendar','estimates','estimate_lines','invoices','invoice_lines','payments',
    'expenses','bills','inventory','tasks','users','employees','teams',
    'contractors','audits','auditLog'];
  arrays.forEach(k => { if (!Array.isArray(db[k])) db[k] = []; });
  if (!db.company)  db.company  = { ...EMPTY_DB.company };
  if (!db.catalogs || Object.keys(db.catalogs).length === 0) {
    db.catalogs = { ...EMPTY_DB.catalogs };
  }
}

};

// Sync a record to Supabase in background (fire and forget)
function syncToCloud(module, record) {
  if (!record || !record.id) return;
  const table = _tableMap.hasOwnProperty(module) ? _tableMap[module] : module;
  if (!table) return; // view-only module
  dbCall('upsert', table, { data: record });
}

function money(v) {
  return '$' + (+v||0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function today(offsetDays=0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0,10);
}

let _uidCounters = {};
function uid(prefix) {
  if (!_uidCounters[prefix]) _uidCounters[prefix] = 0;
  _uidCounters[prefix]++;
  return `${prefix}-${Date.now().toString(36).toUpperCase()}${_uidCounters[prefix]}`;
}

function rows(name) { return Array.isArray(db[name]) ? db[name] : []; }

function customerName(id) { return db.customers.find(x=>x.id===id)?.name || id || '—'; }
function vendorName(id)   { return db.vendors.find(x=>x.id===id)?.name   || id || '—'; }
function serviceName(id)  { return db.services.find(x=>x.id===id)?.name  || id || '—'; }
function invoiceBalance(inv) {
  return Math.max(0, (+inv.total||0) - (+inv.paid||0) - (+inv.writeOff||0));
}

function badge(s) {
  let cls = 'bg-blue';
  if (['Active','Paid','Accepted','Completed','Reconciled','Reviewed'].includes(s)) cls = 'bg-green';
  if (['Overdue','Voided','Rejected','Cancelled','Difference Found','Low Stock','Disputed'].includes(s)) cls = 'bg-red';
  if (['Draft','Sent','Scheduled','Open','Pending Review','Partially Paid'].includes(s)) cls = 'bg-amber';
  if (['Viewed','Approved','Converted to Invoice','Written Off'].includes(s)) cls = 'bg-purple';
  return `<span class="badge ${cls}">${s}</span>`;
}

function table(headers, rowsHtml) {
  return `<div class="table-wrap"><table>
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rowsHtml.join('')}</tbody>
  </table></div>`;
}

function toolbar(module, canNew=true) {
  return `<div class="toolbar">
    <div class="left"><input class="search" data-search="table" placeholder="${tr('search')}"></div>
    <div class="right">
      ${canNew ? `<button class="btn" onclick="openForm('${module}')">+ ${tr('new')}</button>` : ''}
      <button class="btn secondary" onclick="exportTable('${module}')">${tr('exportCsv')}</button>
      <button class="btn secondary" onclick="printCurrent('${module}')">${tr('printPdf')}</button>
    </div>

}

function bindSearch() {
  document.querySelectorAll('[data-search="table"]').forEach(inp => {
    inp.oninput = () => {
      const q = inp.value.toLowerCase();
      document.querySelectorAll('tbody tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    };
  });
}

function log(module, action, before, after) {
  if (!Array.isArray(db.auditLog)) db.auditLog = [];
  db.auditLog.unshift({
    id: uid('LOG'), module, action,
    user: state.role,
    date: new Date().toISOString(),
    before: JSON.stringify(before || ''),
    after:  JSON.stringify(after  || '')
  });
}

function recalcInvoicePaymentStatus(invoiceId) {
  const inv = db.invoices.find(i => i.id === invoiceId);
  if (!inv) return;
  const pmts = db.payments.filter(p => p.invoiceId === invoiceId);
  const totalPaid = pmts.reduce((a,p) => a + (+p.amount||0), 0);
  inv.paid = +totalPaid.toFixed(2);
  const bal = invoiceBalance(inv);
  if (totalPaid <= 0)                              inv.status = inv.status === 'Draft' ? 'Draft' : 'Sent';
  else if (bal <= 0)                               inv.status = 'Paid';
  else                                             inv.status = 'Partially Paid';
}

function allowed(view) {
  const perms = {
    Admin:      ['dashboard','modules','customers','vendors','services','stores','calendar','inventory','estimates','invoices','payments','expenses','audits','tasks','catalogs','reports','settings','auditoria','employees','teams','contractors1099','jobAssignments'],
    Manager:    ['dashboard','modules','customers','vendors','services','stores','calendar','inventory','estimates','invoices','payments','expenses','tasks','reports','auditoria','employees','teams','contractors1099','jobAssignments'],
    Billing:    ['dashboard','customers','estimates','invoices','payments','expenses','tasks','reports'],
    'Field Team':['dashboard','fieldTeam','calendar','tasks','jobAssignments'],
    'Read Only': ['dashboard','reports']
  };
  return (perms[state.role] || perms['Read Only']).includes(view);
}

// ── 8. UI ENGINE ─────────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = navGroups.map(g => {
    const visible = g.items.filter(allowed);
    if (!visible.length) return '';
    const collapsed = !!state.navCollapsed[g.id];
    const btns = visible.map(k =>
      `<button data-key="${k}" class="${state.view===k?'active':''}" onclick="navigate('${k}')">
        ${iconBadge(k,true)}<span class="label">${tr(k)}</span>
      </button>`
    ).join('');
    return `<div class="nav-group ${collapsed?'':'open'}" data-nav-group="${g.id}">
      <button class="nav-group-head" onclick="toggleNavGroup('${g.id}')">
        <span class="nav-group-title">
          <span class="nav-group-icon">${g.icon}</span>
          <span>${g.label}</span>
        </span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="nav-count">${visible.length}</span>
          <span class="nav-chev">›</span>
        </span>
      </button>
      <div class="nav-group-body">${btns}</div>
    </div>`;
  }).join('');
  // Update role selector
  const rs = document.getElementById('roleSelect');
  if (rs) rs.innerHTML = roles.map(r => `<option ${state.role===r?'selected':''}>${r}</option>`).join('');
}

function updateNavActive(view) {
  document.querySelectorAll('#nav button[data-key]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === view);
  });
}

function toggleNavGroup(groupId) {
  state.navCollapsed[groupId] = !state.navCollapsed[groupId];
  localStorage.setItem('b360-nav-collapsed', JSON.stringify(state.navCollapsed));
  renderNav();
}

function navigate(view, force=false) {
  if (!allowed(view)) view = 'dashboard';
  const sameView = (state.view === view);
  state.view = view;

  // Expand nav group for this view
  const group = navGroups.find(g => g.items.includes(view));
  if (group && state.navCollapsed[group.id]) {
    state.navCollapsed[group.id] = false;
    localStorage.setItem('b360-nav-collapsed', JSON.stringify(state.navCollapsed));
    renderNav();
  } else {
    updateNavActive(view);
  }

  // Update page title
  document.getElementById('pageTitle').textContent = tr(view);
  document.getElementById('pageSub').textContent   = tr(view+'Sub') || '';

  // Render content if view changed or force=true or content is empty
  const contentEl = document.getElementById('content');
  if (!sameView || force || !contentEl.innerHTML.trim()) {
    const viewFn = views[view];
    contentEl.innerHTML = viewFn ? viewFn() : `<div class="card"><p>Module "${view}" not found.</p></div>`;
    bindSearch();
  }

  // Close mobile menu
  if (window.innerWidth < 1020) document.getElementById('sidebar').classList.remove('open');
}

function setRole(r) {
  state.role = r;
  if (!allowed(state.view)) state.view = 'dashboard';
  renderNav();
  navigate(state.view, true);
}

function toggleLang() {
  state.lang = state.lang === 'en' ? 'es' : 'en';
  document.documentElement.lang = state.lang;
  document.getElementById('langBtn').textContent = state.lang === 'en' ? 'ES' : 'EN';
  renderNav();
  navigate(state.view, true);
}

function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

  document.getElementById('modalTitle').innerHTML = title;
  document.getElementById('modalBody').innerHTML    = body;
  document.getElementById('modalFoot').innerHTML   = foot || `<button class="btn secondary" onclick="closeModal()">${tr('cancel')}</button>`;

function fieldHtml(f, type, value='', prefix='f-') {
  const label = f.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
  const id = `${prefix}${f}`;
  let input = '';
  if (type.startsWith('select:')) {
    const opts = type.split(':')[1].split('|');
    input = `<select id="${id}">${opts.map(o=>`<option value="${o}" ${String(value)===o?'selected':''}>${o}</option>`).join('')}</select>`;
  } else if (type === 'customer' || type === 'customerOpt') {
    const none = type==='customerOpt' ? '<option value="">General / None</option>' : '';
    input = `<select id="${id}">${none}${db.customers.map(c=>`<option value="${c.id}" ${value===c.id?'selected':''}>${c.name}</option>`).join('')}</select>`;
  } else if (type === 'vendor') {
    input = `<select id="${id}">${db.vendors.map(v=>`<option value="${v.id}" ${value===v.id?'selected':''}>${v.name}</option>`).join('')}</select>`;
  } else if (type === 'service') {
    input = `<select id="${id}">${db.services.map(s=>`<option value="${s.id}" ${value===s.id?'selected':''}>${s.name}</option>`).join('')}</select>`;
  } else if (type === 'textarea') {
    input = `<textarea id="${id}" rows="3">${String(value||'').replaceAll('<','&lt;')}</textarea>`;
  } else if (type === 'assignedSelect') {
    const empOpts = rows('employees').filter(e=>e.status==='Active')
      .map(e=>`<option value="${e.name}" ${String(value)===e.name?'selected':''}>${e.name} (Employee)</option>`).join('');
    const teamOpts = rows('teams').filter(t=>t.status==='Active')
      .map(t=>`<option value="${t.name}" ${String(value)===t.name?'selected':''}>${t.name} (Team)</option>`).join('');
    input = `<select id="${id}"><option value="">— Select employee or team —</option>${empOpts}${teamOpts}</select>`;
  } else if (type.startsWith('catalog:')) {
    const catKey = type.split(':')[1];
    const opts = (db.catalogs && db.catalogs[catKey]) || [];
    input = `<select id="${id}">${opts.map(o=>`<option value="${o}" ${String(value)===o?'selected':''}>${o}</option>`).join('')}</select>`;
  } else if (type === 'teamSelect') {
    const teamOpts = rows('teams').filter(t=>t.status==='Active')
      .map(t=>`<option value="${t.name}" ${String(value)===t.name?'selected':''}>${t.name}</option>`).join('');
    input = `<select id="${id}">
      <option value="Individual" ${'Individual'===String(value)||!value?'selected':''}>Individual (No Team)</option>
      ${teamOpts}
    </select>`;
  } else {
    const t = type==='number'?'number':type==='date'?'date':'text';
    const step = type==='number'?' step="0.01"':'';
    input = `<input id="${id}" type="${t}"${step} value="${String(value||'').replaceAll('"','&quot;')}">`;
  }
  return `<div class="fg"><label>${label}</label>${input}</div>`;
}

function quickAddCustomer() {

  const existing = db.customers.find(c=>c.name.toLowerCase()===name.trim().toLowerCase());
  if (existing) {
    const sel = document.getElementById('f-customerId');
    if (sel) sel.value = existing.id;
    return;
  }
  const c = {
    id: uid('CUS'), name: name.trim(), type:'Commercial',
    email:'', phone:'', address:'', terms:'Net 15',
    lang:'en', status:'Active', credit:0
  };
  db.customers.unshift(c);
  log('Customers','Quick Create from Invoice',null,c);
  save(db);
  syncToCloud('customers', c);

function saveNew(module) {
  const fields = formFields[module] || [];
  const values = { id: uid(({ customers:'CUS',vendors:'VEN',services:'SVC',stores:'STORE',
    jobs:'JOB',estimates:'EST',invoices:'INV',payments:'PAY',expenses:'EXP',
    inventory:'INV',tasks:'TASK' })[module] || 'REC') };

  // Collect form values
  fields.forEach(([f]) => {
    const el = document.getElementById(`f-${f}`);
    if (el) values[f] = el.value;
  });

  // Module-specific defaults
  if (['customers','vendors','services','inventory'].includes(module)) values.status = 'Active';
  // Prefill vendor from vendor360 quick action
  if (module === 'expenses' && _prefillVendor) {
    values.vendorId = _prefillVendor;
    _prefillVendor = null;
  }
  // Prefill customer from customer360 quick action
  if (module === 'jobs' && _prefillCustomer) {
    values.customerId = _prefillCustomer;
    _prefillCustomer = null;
  }
  if (module === 'stores')     { values.activeStatus = values.activeStatus || 'Active'; values.price = +values.price||0; }
  if (module === 'jobs')       { values.status='Scheduled'; values.invoiceId=null; values.checkIn=null; values.checkOut=null; values.photos=0; values.createdDate=today(0); }
  if (module === 'estimates')  { values.date=today(0); values.status='Draft'; values.subtotal=+values.subtotal||0; values.tax=+(values.subtotal*db.company.taxRate/100).toFixed(2); values.total=values.subtotal+values.tax; }
  if (module === 'invoices')   { values.date=today(0); values.status='Draft'; values.subtotal=+values.subtotal||0; values.tax=+(values.subtotal*db.company.taxRate/100).toFixed(2); values.total=values.subtotal+values.tax; values.paid=0; values.writeOff=0; }
  if (module === 'expenses')   { values.date=today(0); values.amount=+values.amount||0; values.status='Pending Review'; }
  if (module === 'services')   values.price = +values.price||0;

  // Save to local db
  if (!Array.isArray(db[module])) db[module] = [];
  db[module].unshift(values);
  log(module, 'Create', null, values);
  save(db);

  // Clean numeric fields — only fix fields that already exist in the record
  Object.keys(values).forEach(f => {
    if (typeof values[f] === 'string' && values[f] === '') {
      // Check if this field should be numeric based on formFields definition
      const fieldDef = (formFields[module]||[]).find(([name])=>name===f);
      if (fieldDef && (fieldDef[1]==='number' || fieldDef[1].startsWith('catalog:'))) {
        // Only zero out if the field type is number
        if (fieldDef[1]==='number') values[f] = 0;
      }
    }
  });

  // Sync to Supabase in background
  syncToCloud(module, values);

  closeModal();
  navigate(state.view, true);
}

function saveEdit(module, id) {
  const list = db[module];
  const rec = Array.isArray(list) ? list.find(x=>x.id===id) : null;
  if (!rec) return;
  const before = JSON.parse(JSON.stringify(rec));
  const fields = formFields[module] || [];

  fields.forEach(([f, t]) => {
    const el = document.getElementById(`edit-${f}`);
    if (!el) return;
    rec[f] = t === 'number' ? +el.value||0 : el.value;
  });

  // Recalc totals if needed
  if (module === 'invoices' || module === 'estimates') {
    rec.tax   = +(rec.subtotal * db.company.taxRate/100).toFixed(2);
    rec.total = +rec.subtotal + rec.tax;
    if (module === 'invoices') recalcInvoicePaymentStatus(rec.id);
  }
  if (module === 'stores' || module === 'services') rec.price = +rec.price||0;

  log(module, 'Edit', before, rec);
  save(db);
  // Clean numeric fields — only fix fields defined as number in formFields
  Object.keys(rec).forEach(f => {
    if (rec[f] === '' || rec[f] === undefined) {
      const fieldDef = (formFields[module]||[]).find(([name])=>name===f);
      if (fieldDef && fieldDef[1]==='number') rec[f] = 0;
    }
  });
  syncToCloud(module, rec);
  closeModal();
  navigate(state.view, true);
}

function archiveRecord(module, id) {
  const list = db[module];
  const rec = Array.isArray(list) ? list.find(x=>x.id===id) : null;
  if (!rec) return;
  const newStatus = rec.status === 'Active' ? 'Inactive' : 'Active';
  const label = newStatus === 'Inactive' ? 'Archive/Deactivate' : 'Restore';
  if (!confirm(`${label} this record? / ¿${label} este registro?`)) return;
  const before = { ...rec };
  rec.status = newStatus;
  log(module, label, before, rec);
  save(db);
  dbCall('update', module, { id, data: { status: rec.status } });
  navigate(state.view, true);
}

// Filter state per module
const _filters = {};
function setFilter(module, status) {
  _filters[module] = status;
  navigate(state.view, true);
}
function getFilter(module) { return _filters[module] || 'Active'; }
function applyFilter(module, data) {
  const f = getFilter(module);
  if (f === 'All') return data;
  const field = module === 'stores' ? 'activeStatus' : 'status';
  return data.filter(r => (r[field]||'Active') === f);
}

  // ── AUDITORÍA / CHANGES ────────────────────────────────────
  auditoria() {
    const log = db.auditLog || [];

    // Filter state
    const mf = _auditFilters.module || 'All';
    const af = _auditFilters.action || 'All';
    const uf = _auditFilters.user   || 'All';
    const df = _auditFilters.date   || 'All';

    let data = [...log];

    // Module filter
    if (mf !== 'All') data = data.filter(l=>l.module===mf);
    // Action filter
    if (af !== 'All') data = data.filter(l=>l.action===af);
    // User filter
    if (uf !== 'All') data = data.filter(l=>l.user===uf);
    // Date filter
    const t0 = today(0);
    const t7 = today(-7);
    const t30= today(-30);
    if (df === 'Today')    data = data.filter(l=>l.date&&l.date.slice(0,10)===t0);
    else if (df === 'Week')  data = data.filter(l=>l.date&&l.date.slice(0,10)>=t7);
    else if (df === 'Month') data = data.filter(l=>l.date&&l.date.slice(0,10)>=t30);

    // Get unique values for filter dropdowns
    const modules = ['All',...new Set(log.map(l=>l.module).filter(Boolean))];
    const actions = ['All',...new Set(log.map(l=>l.action).filter(Boolean))];
    const users   = ['All',...new Set(log.map(l=>l.user).filter(Boolean))];
    const dates   = ['All','Today','Week','Month'];

    const bodyRows = data.slice(0,200).map(l => {
      let afterObj = {};
      try { afterObj = JSON.parse(l.after||'{}'); } catch(e) {}
      const recId = afterObj.id || afterObj.name || '';
      return `<tr>
        <td style="white-space:nowrap;font-size:12px">${new Date(l.date).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
        <td>${l.user||''}</td>
        <td><span class="badge bg-blue" style="font-size:11px">${l.module||''}</span></td>
        <td>${l.action||''}</td>
        <td style="font-size:12px;color:var(--muted)">${recId}</td>
        <td>
          ${l.before&&l.before!=='""'?`<button class="btn small secondary" onclick="showAuditDiff('${l.id}')">Diff</button>`:''}
        </td>
      </tr>`;
    });

    return `
      <div class="grid four-col" style="margin-bottom:16px">
        <div class="card kpi"><div class="label">Total Changes</div><div class="value">${log.length}</div></div>
        <div class="card kpi"><div class="label">Today</div><div class="value">${log.filter(l=>l.date&&l.date.slice(0,10)===t0).length}</div></div>
        <div class="card kpi"><div class="label">This Week</div><div class="value">${log.filter(l=>l.date&&l.date.slice(0,10)>=t7).length}</div></div>
        <div class="card kpi"><div class="label">Showing</div><div class="value">${Math.min(data.length,200)}</div></div>
      </div>

      <div class="card" style="margin-bottom:12px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end">
          <div>
            <div class="role-note" style="margin-bottom:4px">Module</div>
            <select onchange="setAuditFilter('module',this.value)" style="width:100%">
              ${modules.map(m=>`<option value="${m}" ${mf===m?'selected':''}>${m}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="role-note" style="margin-bottom:4px">Action</div>
            <select onchange="setAuditFilter('action',this.value)" style="width:100%">
              ${actions.map(a=>`<option value="${a}" ${af===a?'selected':''}>${a}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="role-note" style="margin-bottom:4px">User</div>
            <select onchange="setAuditFilter('user',this.value)" style="width:100%">
              ${users.map(u=>`<option value="${u}" ${uf===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="role-note" style="margin-bottom:4px">Date Range</div>
            <div class="seg">
              ${dates.map(d=>`<button class="${df===d?'active':''}" onclick="setAuditFilter('date','${d}')">${d}</button>`).join('')}
            </div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn small secondary" onclick="clearAuditFilters()">Clear Filters</button>
          <button class="btn small secondary" onclick="exportTable('auditLog')">Export CSV</button>
        </div>
      </div>

      ${data.length===0
        ? '<div class="card"><p class="role-note" style="text-align:center;padding:24px">No records match the current filters.</p></div>'
        : table(['Date','User','Module','Action','Record',''], bodyRows)}
      ${data.length>200?`<p class="role-note" style="text-align:center;margin-top:8px">Showing first 200 of ${data.length} records. Use filters to narrow down.</p>`:''}`;
  },

        <div class="card" style="margin-bottom:16px;text-align:center;background:var(--green);color:#fff">
          <div style="font-size:13px;opacity:.8">Today / Hoy</div>

          <div style="font-size:13px;opacity:.8;margin-top:4px">${todayJobs.length} job${todayJobs.length!==1?'s':''} scheduled</div>
        </div>
        ${todayJobs.length ? jobCards : `
          <div class="card" style="text-align:center;padding:40px">
            <div style="font-size:48px;margin-bottom:12px">☀️</div>
            <h3>No jobs today</h3>
            <p class="role-note">No hay trabajos programados para hoy.</p>

  // ── CALENDAR ────────────────────────────────────────────────
  calendar() {
    const base = (() => { const d=new Date(); d.setMonth(d.getMonth()+state.calOffset); d.setDate(1); return d; })();
    const month = base.toLocaleDateString(state.lang==='es'?'es-US':'en-US',{month:'long',year:'numeric'});
    const allJobs = rows('jobs');
    const allCal  = rows('calendar');
    const allEvents = [...allJobs, ...allCal];

    // Build calendar grid
    const firstDay = base.getDay();
    const daysInMonth = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    let cells = '';
    for (let i=0; i<firstDay; i++) cells += '<div class="day other-month"></div>';
    for (let d=1; d<=daysInMonth; d++) {
      const iso = `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayEvents = allEvents.filter(e=>e.date===iso);
      const isToday = iso === today(0);
      cells += `<div class="day${isToday?' today':''}${dayEvents.length?' has-event':''}">
        <div class="num">${d}
          <button class="add-day" onclick="openJobForm('${iso}')">+</button>
        </div>
        ${dayEvents.slice(0,3).map(e=>`<div class="event ${e.status==='Completed'?'done':e.status==='Cancelled'?'cancelled':'job'}" 
          onclick="openJobDetail('${e.id}')" title="${customerName(e.customerId||e.customer)}">
          ${e.time||''} ${customerName(e.customerId||e.customer).split(' ')[0]}
        </div>`).join('')}
        ${dayEvents.length>3?`<div class="event" style="opacity:.6">+${dayEvents.length-3} more</div>`:''}
      </div>`;
    }

    // List view
    const _cf = _calFilter || 'All';
    const filteredEvents = _cf === 'All' ? [...allEvents] :
      [...allEvents].filter(e=>(e.status||'Scheduled')===_cf);
    const listRows = filteredEvents.sort((a,b)=>(a.date+a.time||'').localeCompare(b.date+b.time||'')).map(e=>`
      <tr>
        <td>${e.date}</td><td>${e.time||''}</td>
        <td>${customerName(e.customerId||e.customer)}</td>
        <td>${serviceName(e.serviceId||e.service)}</td>
        <td>${e.assigned||e.team||''}</td>
        <td>${badge(e.status||'Scheduled')}</td>
        <td>${editBtn('jobs',e.id)}</td>
      </tr>`);

    return `
      <div class="calendar-toolbar">
        <div>
          <div class="calendar-title">${month}</div>
          <div class="role-note">Monthly calendar · Click + to add a job</div>
        </div>
        <div class="calendar-actions">
          <button class="btn secondary" onclick="state.calOffset--;navigate('calendar',true)">‹ Prev</button>
          <button class="btn secondary" onclick="state.calOffset=0;navigate('calendar',true)">Today</button>
          <button class="btn secondary" onclick="state.calOffset++;navigate('calendar',true)">Next ›</button>
          <button class="btn" onclick="openForm('jobs')">+ New Job</button>
        </div>
      </div>
      <div class="calendar-dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="calendar">${cells}</div>
      <div class="calendar-list" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <h3 style="margin:0">All Jobs / Todos los trabajos</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div class="seg">
              ${['All','Scheduled','In Progress','Completed','Cancelled'].map(s=>`<button class="${(_calFilter||'All')===s?'active':''}" onclick="setCalFilter('${s}')">${s}</button>`).join('')}
            </div>
          </div>
        </div>
        ${table(['Date','Time','Customer','Service','Assigned','Status',tr('actions')], listRows)}
      </div>`;
  },

        <button class="btn small" onclick="convertEstimate('${e.id}')">→ Invoice</button>

  // ── JOB ASSIGNMENTS ─────────────────────────────────────────
  jobAssignments() {
    const sf  = _jobFilters.status || 'All';
    const df  = _jobFilters.date   || 'All';
    const af  = _jobFilters.assign || 'All';

    let data = rows('jobs');

    // Status filter
    if (sf !== 'All') data = data.filter(j=>(j.status||'Scheduled')===sf);

    // Date filter
    const t0 = today(0);
    const t7 = today(7);
    const t30= today(30);
    if (df === 'Today')      data = data.filter(j=>j.date===t0);
    else if (df === 'Week')  data = data.filter(j=>j.date>=t0&&j.date<=t7);
    else if (df === 'Month') data = data.filter(j=>j.date>=t0&&j.date<=t30);

    // Assigned filter
    if (af === 'Unassigned') data = data.filter(j=>!j.assigned||j.assigned==='');
    else if (af === 'Assigned') data = data.filter(j=>j.assigned&&j.assigned!=='');

    // Sort by date
    data.sort((a,b)=>(a.date+a.time||'').localeCompare(b.date+b.time||''));

    const all  = rows('jobs');
    const unsn = all.filter(j=>(!j.assigned||j.assigned==='')&&j.status==='Scheduled').length;
    const comp = all.filter(j=>j.status==='Completed').length;

    const bodyRows = data.map(j=>`<tr>
      <td>${j.date||''}</td>
      <td>${j.time||''}</td>
      <td><strong>${customerName(j.customerId)}</strong></td>
      <td>${serviceName(j.serviceId)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <select onchange="assignJob('${j.id}',this.value)" style="font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--gray-200)">
            <option value="">— Assign —</option>
            ${rows('employees').filter(e=>e.status==='Active').map(e=>`<option value="${e.name}" ${j.assigned===e.name?'selected':''}>${e.name}</option>`).join('')}
            ${rows('teams').filter(t=>t.status==='Active').map(t=>`<option value="${t.name}" ${j.assigned===t.name?'selected':''}>${t.name}</option>`).join('')}
          </select>
          ${j.assigned?`<span class="badge bg-green" style="font-size:11px">${j.assigned}</span>`:'<span class="badge bg-amber">Unassigned</span>'}
        </div>
      </td>
      <td>${badge(j.status||'Scheduled')}</td>
      <td>
        ${editBtn('jobs',j.id)}
        ${j.status==='Scheduled'?`<button class="btn small" onclick="checkInJob('${j.id}')">Check In</button>`:''}
        ${j.status==='In Progress'?`<button class="btn small secondary" onclick="checkOutJob('${j.id}')">Check Out</button>`:''}
      </td>
    </tr>`);

    const statusOpts = ['All','Scheduled','In Progress','Completed','Cancelled'];
    const dateOpts   = ['All','Today','Week','Month'];
    const assignOpts = ['All','Unassigned','Assigned'];

    return `
      <div class="grid four-col" style="margin-bottom:16px">
        <div class="card kpi"><div class="label">Total Jobs</div><div class="value">${all.length}</div></div>
        <div class="card kpi"><div class="label">Scheduled</div><div class="value">${all.filter(j=>j.status==='Scheduled').length}</div></div>
        <div class="card kpi"><div class="label">Unassigned</div><div class="value" style="color:${unsn>0?'var(--red)':'var(--green)'}">${unsn}</div></div>
        <div class="card kpi"><div class="label">Completed</div><div class="value">${comp}</div></div>
      </div>
      <div class="filter-row" style="flex-wrap:wrap;gap:12px">
        <div>
          <span class="role-note" style="margin-right:6px">Status:</span>
          <div class="seg">${statusOpts.map(s=>`<button class="${sf===s?'active':''}" onclick="setJobFilter('status','${s}')">${s}</button>`).join('')}</div>
        </div>
        <div>
          <span class="role-note" style="margin-right:6px">Date:</span>
          <div class="seg">${dateOpts.map(s=>`<button class="${df===s?'active':''}" onclick="setJobFilter('date','${s}')">${s}</button>`).join('')}</div>
        </div>
        <div>
          <span class="role-note" style="margin-right:6px">Assigned:</span>
          <div class="seg">${assignOpts.map(s=>`<button class="${af===s?'active':''}" onclick="setJobFilter('assign','${s}')">${s}</button>`).join('')}</div>
        </div>
      </div>
      <p class="role-note" style="margin:8px 0">Showing ${data.length} of ${all.length} jobs</p>
      ${table(['Date','Time','Customer','Service','Assign / Assigned','Status',tr('actions')], bodyRows)}`;
  }

}; // end views{}

// ── 11. UTILITY FUNCTIONS ────────────────────────────────────
function customer360(id) {
  const c = db.customers.find(x=>x.id===id);
  if (!c) return;
  const invoices  = rows('invoices').filter(i=>i.customerId===id);
  const estimates = rows('estimates').filter(e=>e.customerId===id);
  const jobs      = rows('jobs').filter(j=>j.customerId===id);
  const payments  = rows('payments').filter(p=>p.customerId===id);
  const addresses = rows('addresses').filter(a=>a.customerId===id);
  const totalAR   = invoices.reduce((a,i)=>a+invoiceBalance(i),0);
  const totalPaid = payments.reduce((a,p)=>a+(+p.amount||0),0);
  const totalSales= invoices.reduce((a,i)=>a+(+i.total||0),0);

  // KPI cards
  const kpis = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      <div class="card kpi"><div class="label">Total Sales</div><div class="value">${money(totalSales)}</div></div>
      <div class="card kpi"><div class="label">Collected</div><div class="value">${money(totalPaid)}</div></div>
      <div class="card kpi"><div class="label">Open AR</div><div class="value" style="color:${totalAR>0?'var(--red)':'var(--green)'}">${money(totalAR)}</div></div>
      <div class="card kpi"><div class="label">Jobs Total</div><div class="value">${jobs.length}</div></div>
    </div>`;

  // Contact info
  const contact = `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h4 style="margin:0">Contact Info</h4>
        <button class="btn small secondary" onclick="closeModal();openEdit('customers','${id}')">Edit</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px">
        <div><span class="role-note">Email</span><br>${c.email||'—'}</div>
        <div><span class="role-note">Phone</span><br>${c.phone||'—'}</div>
        <div><span class="role-note">Address</span><br>${c.address||'—'}</div>
        <div><span class="role-note">Terms</span><br>${c.terms||'—'}</div>
        <div><span class="role-note">Type</span><br>${c.type||'—'}</div>
        <div><span class="role-note">Credit</span><br>${money(c.credit||0)}</div>
      </div>
    </div>`;

  // Quick actions
  const actions = `
    <div class="card" style="margin-bottom:12px">
      <h4 style="margin:0 0 10px">Quick Actions</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="closeModal();_prefillCustomer='${id}';openInvoiceForm()">+ New Invoice</button>
        <button class="btn secondary" onclick="closeModal();_prefillCustomer='${id}';openEstimateForm()">+ New Estimate</button>
        <button class="btn secondary" onclick="closeModal();_prefillCustomer='${id}';openForm('jobs')">+ New Job</button>
        <button class="btn secondary" onclick="closeModal();addAddress('${id}')">+ Address</button>
      </div>
    </div>`;

  // Addresses
  const addrSection = addresses.length ? `
    <div class="card" style="margin-bottom:12px">
      <h4 style="margin:0 0 10px">Service Addresses (${addresses.length})</h4>
      ${addresses.map(a=>`
        <div class="location-card" style="margin-bottom:6px">
          <strong>${a.name||'Location'}</strong> · ${a.frequency||''} · ${money(a.basePrice||0)}<br>
          <span class="role-note">${a.address||''}</span>
          ${a.notes?`<br><span class="role-note">📝 ${a.notes}</span>`:''}
        </div>`).join('')}
    </div>` : '';

  // Invoices table
  const invSection = invoices.length ? `
    <div class="card" style="margin-bottom:12px">
      <h4 style="margin:0 0 8px">Invoices (${invoices.length})</h4>
      <div class="table-wrap"><table>
        <thead><tr><th>Invoice</th><th>Date</th><th>Due</th><th>Status</th><th>Total</th><th>Balance</th><th></th></tr></thead>
        <tbody>${invoices.map(i=>`<tr>
          <td><strong>${i.id}</strong></td>
          <td>${i.date||''}</td><td>${i.due||''}</td>
          <td>${badge(i.status)}</td>
          <td>${money(i.total)}</td>
          <td style="color:${invoiceBalance(i)>0?'var(--red)':'var(--green)'}">${money(invoiceBalance(i))}</td>
          <td>
            <button class="btn small secondary" onclick="docPreview('invoice','${i.id}')">PDF</button>
            <button class="btn small" onclick="openPayment('${i.id}')">Pay</button>
          </td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>` : '<div class="card" style="margin-bottom:12px"><p class="role-note">No invoices yet.</p></div>';

  const estSection = estimates.length ? `

        <thead><tr><th>Estimate</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead>

  // Payments summary
  const paySection = payments.length ? `
    <div class="card" style="margin-bottom:12px">
      <h4 style="margin:0 0 8px">Payment History (${payments.length})</h4>
      <div class="table-wrap"><table>
        <thead><tr><th>Payment</th><th>Date</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Recon</th></tr></thead>

function openPayment(invId) {
  const opts = invoiceOptions();
  const body = `<div class="form-grid">
    <div class="fg span-2"><label>Invoice</label>
      <select id="pay-invoice" onchange="updatePayAmt()">${opts}</select>
    </div>
    <div class="fg"><label>Date</label><input id="pay-date" type="date" value="${today(0)}"></div>
    <div class="fg"><label>Amount Due</label><input id="pay-dueamt" readonly></div>
    <div class="fg"><label>Payment Amount</label><input id="pay-amount" type="number" step="0.01" oninput="updatePayAmt()"></div>
    <div class="fg"><label>Remaining</label><input id="pay-remaining" readonly></div>
    <div class="fg"><label>Method</label>
      <select id="pay-method">${(db.catalogs.paymentMethods||[]).map(x=>`<option>${x}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Reference</label><input id="pay-ref"></div>
    <div class="fg span-2"><label>Proof Note</label><input id="pay-proof"></div>
  </div>`;
  openModal('Record Payment', body,
    `<button class="btn secondary" onclick="closeModal()">${tr('cancel')}</button>
     <button class="btn" onclick="savePayment()">Save Payment</button>`);
  setTimeout(() => { if (invId) document.getElementById('pay-invoice').value = invId; updatePayAmt(); }, 0);
}

function updatePayAmt() {
  const invId = document.getElementById('pay-invoice')?.value;
  const inv = db.invoices.find(i=>i.id===invId);
  const due = inv ? invoiceBalance(inv) : 0;
  const amt = +document.getElementById('pay-amount')?.value || 0;
  const dueEl = document.getElementById('pay-dueamt');
  const remEl = document.getElementById('pay-remaining');
  if (dueEl) dueEl.value = due.toFixed(2);
  if (remEl) remEl.value = Math.max(0, due - amt).toFixed(2);
}

function savePayment() {
  const invId = document.getElementById('pay-invoice')?.value;
  const inv = db.invoices.find(i=>i.id===invId);
  if (!inv) { alert('Select a valid invoice'); return; }
  const amount = +document.getElementById('pay-amount')?.value || 0;
  if (amount <= 0) { alert('Enter a payment amount greater than zero'); return; }
  const p = {
    id:        uid('PAY'),
    invoiceId: inv.id,
    customerId:inv.customerId,
    date:      document.getElementById('pay-date')?.value || today(0),
    origAmt:   +inv.total || 0,
    amountDue: invoiceBalance(inv),
    amount,
    remaining: Math.max(0, invoiceBalance(inv) - amount),
    method:    document.getElementById('pay-method')?.value || 'Cash',
    reference: document.getElementById('pay-ref')?.value || '',
    proof:     document.getElementById('pay-proof')?.value || '',
    recon:     'Pending Review'
  };
  db.payments.unshift(p);
  recalcInvoicePaymentStatus(inv.id);
  log('Payments','Create',null,p);
  save(db);
  syncToCloud('payments', p);
  closeModal();
  navigate('payments', true);
}

  const p = db.payments.find(x=>x.id===id);
  if (!p) return;
  const body = `<div class="form-grid">
    <div class="fg span-2">
      <label>Payment</label>

function saveRecon(id) {
  const p = db.payments.find(x=>x.id===id);

  const before = {...p};

  db.catalogs[k].splice(idx, 1);
  log('Catalogs','Remove item',k,idx);
  save(db);
  // Sync catalogs to Supabase
  dbCall('updateCatalogs', null, { data: db.catalogs });
  navigate('catalogs', true);

function addCatalogItem(k) {
  const el = document.getElementById(`cat-${k}`);
  if (!el || !el.value.trim()) return;
  if (!Array.isArray(db.catalogs[k])) db.catalogs[k] = [];
  db.catalogs[k].push(el.value.trim());
  log('Catalogs','Add item',k,el.value.trim());
  save(db);
  // Sync catalogs to Supabase
  dbCall('updateCatalogs', null, { data: db.catalogs });
  el.value = '';
  navigate('catalogs', true);
}

    </div>
    ${doc}
  </body></html>`);
  printWin.document.close();
}

function addAddress(customerId) {
  const c = db.customers.find(x=>x.id===customerId);
  if (!c) return;
  const body = `<div class="form-grid">
    <div class="fg span-2"><label>Location Name</label><input id="addr-name" placeholder="Main Office, Home, etc."></div>
    <div class="fg span-2"><label>Address</label><input id="addr-address" value="${c.address||''}"></div>
    <div class="fg"><label>Frequency</label>
      <select id="addr-frequency">
        ${['One-time','Weekly','Bi-weekly','Monthly','Quarterly'].map(f=>`<option>${f}</option>`).join('')}
      </select>
    </div>
    <div class="fg"><label>Base Price</label><input id="addr-price" type="number" step="0.01"></div>
    <div class="fg span-2"><label>Notes / Access Instructions</label><textarea id="addr-notes" rows="2"></textarea></div>
  </div>`;
  openModal(`Add Address — ${c.name}`, body,
    `<button class="btn secondary" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="saveAddress('${customerId}')">Save Address</button>`);
}

function saveAddress(customerId) {
  const addr = {
    id:         uid('ADDR'),
    customerId,
    name:       document.getElementById('addr-name')?.value || '',
    address:    document.getElementById('addr-address')?.value || '',
    frequency:  document.getElementById('addr-frequency')?.value || 'One-time',
    basePrice:  +document.getElementById('addr-price')?.value || 0,
    notes:      document.getElementById('addr-notes')?.value || ''
  };
  if (!Array.isArray(db.addresses)) db.addresses = [];
  db.addresses.push(addr);
  log('Addresses','Create',null,addr);
  save(db);
  syncToCloud('addresses', addr);
  closeModal();
  customer360(customerId);
}

function vendor360(id) {
  const v = db.vendors.find(x=>x.id===id);
  if (!v) return;
  const bills    = rows('bills').filter(b=>b.vendorId===id);
  const expenses = rows('expenses').filter(e=>e.vendorId===id);
  const totalAP  = bills.reduce((a,b)=>a+(+b.amount||0)-(+b.paid||0),0);
  const totalExp = expenses.reduce((a,e)=>a+(+e.amount||0),0);

  const kpis = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
      <div class="card kpi"><div class="label">Open AP</div><div class="value" style="color:${totalAP>0?'var(--red)':'var(--green)'}">${money(totalAP)}</div></div>
      <div class="card kpi"><div class="label">Total Expenses</div><div class="value">${money(totalExp)}</div></div>
      <div class="card kpi"><div class="label">Bills</div><div class="value">${bills.length}</div></div>
    </div>`;

  const contact = `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h4 style="margin:0">Vendor Info</h4>
        <button class="btn small secondary" onclick="closeModal();openEdit('vendors','${id}')">Edit</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px">
        <div><span class="role-note">Category</span><br>${v.category||'—'}</div>
        <div><span class="role-note">Email</span><br>${v.email||'—'}</div>
        <div><span class="role-note">Phone</span><br>${v.phone||'—'}</div>
        <div><span class="role-note">Status</span><br>${badge(v.status||'Active')}</div>
      </div>
    </div>`;

  const actions = `
    <div class="card" style="margin-bottom:12px">
      <h4 style="margin:0 0 10px">Quick Actions</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="closeModal();_prefillVendor='${id}';openForm('expenses')">+ New Expense</button>
      </div>
    </div>`;

  const billSection = bills.length ? `
    <div class="card" style="margin-bottom:12px">
      <h4 style="margin:0 0 8px">Bills (${bills.length})</h4>
      <div class="table-wrap"><table>
        <thead><tr><th>Bill</th><th>Date</th><th>Due</th><th>Status</th><th>Amount</th><th>Balance</th></tr></thead>
        <tbody>${bills.map(b=>`<tr>
          <td>${b.id}</td><td>${b.date||''}</td><td>${b.due||''}</td>
          <td>${badge(b.status||'Open')}</td>
          <td>${money(b.amount)}</td>
          <td style="color:${(+b.amount-(+b.paid||0))>0?'var(--red)':'var(--green)'}">${money((+b.amount||0)-(+b.paid||0))}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>` : '';

  const expSection = expenses.length ? `
    <div class="card">
      <h4 style="margin:0 0 8px">Expenses (${expenses.length})</h4>
      <div class="table-wrap"><table>
        <thead><tr><th>Expense</th><th>Date</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>${expenses.slice(0,8).map(e=>`<tr>
          <td>${e.id}</td><td>${e.date||''}</td>
          <td>${e.category||''}</td><td>${money(e.amount)}</td>
          <td>${badge(e.status||'Pending Review')}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>` : '';

  openModal(`360° — ${v.name}`,
    kpis + contact + actions + billSection + expSection,
    `<button class="btn secondary" onclick="closeModal()">Close</button>`);
}

function showAuditDiff(logId) {
  const entry = (db.auditLog||[]).find(l=>l.id===logId);
  if (!entry) return;
  let before = {}, after = {};
  try { before = JSON.parse(entry.before||'{}'); } catch(e) {}
  try { after  = JSON.parse(entry.after ||'{}'); } catch(e) {}
  const allKeys = [...new Set([...Object.keys(before), ...Object.keys(after)])];
  const rows = allKeys.filter(k=>String(before[k])!==String(after[k])).map(k=>`
    <tr>
      <td><strong>${k}</strong></td>
      <td style="color:var(--red);text-decoration:line-through">${before[k]??'—'}</td>
      <td style="color:var(--green)">${after[k]??'—'}</td>
    </tr>`).join('');
  openModal(`Change Diff — ${entry.module} · ${entry.action}`,
    `<p class="role-note" style="margin-bottom:12px">${new Date(entry.date).toLocaleString()} · ${entry.user}</p>
     ${rows ? `<div class="table-wrap"><table>
       <thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead>
       <tbody>${rows}</tbody>
     </table></div>` : '<p class="role-note">No field changes detected.</p>'}`,
    `<button class="btn secondary" onclick="closeModal()">Close</button>`);
}

function assignJob(jobId, employeeName) {
  const j = db.jobs.find(x=>x.id===jobId);

  const before = {...j};

function checkInJob(jobId) {
  const j = db.jobs.find(x=>x.id===jobId);
  if (!j) return;
  const before = {...j};
  j.status  = 'In Progress';
  j.checkIn = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  log('Jobs','Check In',before,j);
  save(db);
  syncToCloud('jobs', j);
  navigate('jobAssignments', true);
}

function checkOutJob(jobId) {
  const j = db.jobs.find(x=>x.id===jobId);
  if (!j) return;
  const before = {...j};
  j.status   = 'Completed';
  j.checkOut = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  log('Jobs','Check Out',before,j);
  save(db);
  syncToCloud('jobs', j);
  // Auto-prompt to create invoice
  if (confirm(`Job ${jobId} completed! Create invoice now? / ¿Crear factura ahora?`)) {
    _prefillCustomer = j.customerId;
    navigate('invoices', true);
    setTimeout(()=>openInvoiceForm(), 100);
  } else {
    navigate('jobAssignments', true);
  }
}

function exportTable(module) {
  const data = db[module] || [];
  if (!data.length) { alert('No data to export'); return; }
  const keys = [...new Set(data.flatMap(o=>Object.keys(o)))];
  const csv  = keys.join(',') + '\n' + data.map(r=>keys.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `${module}.csv`;
  a.click();
}

function importAuditCsv(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split(/\r?\n/).filter(Boolean);
    const rowCount = Math.max(0, lines.length - 1);
    const audit = {
      id: uid('AUD'), source:file.name, date:today(0), rows:rowCount,
      matches:Math.max(0,rowCount-2), differences:Math.min(rowCount,2),
      status: rowCount ? 'Requires Review' : 'Empty'
    };
    db.audits.unshift(audit);
    log('CSV Audits','Import',null,audit);
    save(db);
    navigate('audits', true);
  };
  reader.readAsText(file);
}

}
