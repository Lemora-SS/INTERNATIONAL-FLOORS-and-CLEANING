color:rgba(255,255,255,.42);letter-spacing:0;text-transform:none}.nav-chev{font-size:12px;transition:transform .18s ease;color:rgba(255,255,255,.55)}.nav-group.open .nav-chev{transform:rotate(90deg);color:white}.nav-group-body{display:none;padding-top:5px}.nav-group.open .nav-group-body{display:block}.sidebar-footer{margin-top:auto;font-size:11px;color:rgba(255,255,255,.42);border-top:1px solid rgba(255,255,255,.10);padding-top:12px;line-height:1.45}.main{display:flex;flex-direction:column;height:100vh;min-width:0}.topbar{height:72px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}.top-left{min-width:0}.top-left h2{margin:0;font-size:22px}.top-left p{margin:3px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill,.select,select,input,textarea{border:1px solid var(--line);border-radius:12px;background:white;padding:10px 12px;font-size:13px;color:var(--ink)}.pill{display:inline-flex;align-items:center;gap:8px}.status-dot{width:8px;height:8px;border-radius:50%;background:#52b86a}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--green);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.small{font-size:12px;padding:7px 10px;border-radius:10px}.content{padding:22px;overflow:auto}.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.kpi-grid{grid-template-columns:repeat(4,minmax(160px,1fr));margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.kpi .value{font-size:28px;font-weight:900;margin-top:6px}.kpi .sub{color:var(--muted);font-size:12px;margin-top:3px}.span-2{grid-column:span 2}.span-3{grid-column:span 3}.module-grid{grid-template-columns:repeat(3,minmax(220px,1fr))}.module-card{cursor:pointer;transition:.15s}.module-card:hover{transform:translateY(-2px);border-color:#aad5b4}.module-card .icon{font-size:28px}.module-card h3{margin:8px 0 6px}.module-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:260px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 12px;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f7faf6;position:sticky;top:0}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.bg-green{background:var(--green2);color:var(--green)}.bg-blue{background:#e9f1fb;color:var(--blue)}.bg-amber{background:#fff4da;color:var(--amber)}.bg-red{background:#fdeaea;color:var(--red)}.bg-purple{background:#f1ebfb;color:var(--purple)}.two-col{grid-template-columns:1.25fr .75fr}.three-col{grid-template-columns:repeat(3,1fr)}.alert-list{display:flex;flex-direction:column;gap:10px}.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.alert .mark{width:10px;height:10px;border-radius:50%;background:var(--amber);margin-top:4px;flex:0 0 auto}.alert.red .mark{background:var(--red)}.alert.green .mark{background:var(--green)}.alert strong{display:block;font-size:13px}.alert span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:112px;border:1px solid var(--line);border-radius:16px;background:white;padding:10px}.day .num{font-weight:900}.event{margin-top:8px;padding:7px 8px;border-radius:10px;background:var(--green2);font-size:11px;color:var(--green);font-weight:800}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fg{display:flex;flex-direction:column;gap:5px}.fg label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(860px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:20px}.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.x{background:transparent;border:0;font-size:26px;cursor:pointer;color:var(--muted)}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px}.cat-card h4{margin:0 0 10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f3f6f2;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px}.chart-bars{height:190px;display:flex;align-items:flex-end;gap:10px}.bar{flex:1;background:linear-gradient(180deg,#5aae72,#1f6b3a);border-radius:12px 12px 0 0;min-height:12px;position:relative}.bar::after{content:attr(data-label);position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}.print-doc{font-family:Arial,sans-serif;background:white;color:#111;padding:30px;max-width:850px;margin:auto}.print-doc .doc-head{display:flex;justify-content:space-between;border-bottom:3px solid #1f6b3a;padding-bottom:14px}.print-doc h1{margin:0;color:#1f6b3a}.print-doc table{min-width:0}.hidden{display:none!important}.mobile-menu{display:none}.role-note{font-size:12px;color:var(--muted)}

.module-grid{grid-template-columns:1fr;gap:16px}
.module-map{display:flex;flex-direction:column;gap:18px}
.flow-section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.flow-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.flow-section-head h3{margin:0;font-size:17px}
.flow-section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.flow-tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;background:#f6f8f6;border:1px solid var(--line);color:var(--ink)}
.flow-track{display:flex;align-items:center;gap:8px;overflow:auto;padding:4px 2px 8px;scrollbar-width:thin}
.flow-node{min-width:168px;background:#fbfcfb;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;position:relative}
.flow-node:hover{transform:translateY(-2px);border-color:#b7d9c0;box-shadow:0 10px 18px rgba(18,50,20,.08)}
.flow-node::after{content:'';position:absolute;inset:0;border-radius:18px;border-top:3px solid var(--node-accent, #1f6b3a);opacity:.95}
.flow-node .node-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flow-node h4{margin:0;font-size:14px;line-height:1.2}
.flow-node p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.flow-arrow{position:relative;flex:0 0 34px;height:2px;background:linear-gradient(90deg,#d2ddd2,#8eb79a);border-radius:999px}
.flow-arrow::after{content:'›';position:absolute;right:-1px;top:50%;transform:translateY(-51%);font-size:18px;color:#7c9982;font-weight:900}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}
.quick-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.15s}
.quick-card:hover{transform:translateY(-2px);border-color:#b7d9c0;box-shadow:0 10px 18px rgba(18,50,20,.08)}
.quick-card h4{margin:0 0 4px;font-size:14px}.quick-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.icon-badge{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.icon-badge.small{width:32px;height:32px;border-radius:10px;font-size:16px}
.icon-badge.green{background:linear-gradient(180deg,#ecf8ef,#d8efdf);color:#1d6a39}
.icon-badge.blue{background:linear-gradient(180deg,#eef5fd,#dceaf9);color:#2463a8}
.icon-badge.amber{background:linear-gradient(180deg,#fff8e7,#ffedbf);color:#9a6500}
.icon-badge.red{background:linear-gradient(180deg,#fff0f0,#ffd9d9);color:#a12828}
.icon-badge.purple{background:linear-gradient(180deg,#f5efff,#e6d9ff);color:#6941a3}
.icon-badge.gray{background:linear-gradient(180deg,#f4f5f6,#e7eaed);color:#49535b}
.node-step{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nav button{padding:9px 10px}
.nav button .ico{width:auto;text-align:left;display:inline-flex}
.nav button .label{font-weight:700}
.nav-group-head .group-ico{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:14px}
.cat-card{position:relative;overflow:hidden;padding:15px}
.cat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat-accent,#1f6b3a)}
.cat-card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.cat-card h4{margin:0;font-size:15px}.cat-card .cat-meta{font-size:12px;color:var(--muted);margin-top:4px}
.cat-card .used-in{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.mini-chip{background:#f7f8f7;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#f3f6f2;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}
.mod-note{font-size:12px;color:var(--muted);margin-bottom:10px}
@media(max-width:1020px){.quick-grid,.catalog-grid{grid-template-columns:1fr}.flow-track{flex-direction:column;align-items:stretch}.flow-node{min-width:0}.flow-arrow{width:2px;height:18px;align-self:center;background:linear-gradient(180deg,#d2ddd2,#8eb79a)}.flow-arrow::after{content:'⌄';right:auto;left:50%;top:auto;bottom:-8px;transform:translateX(-50%);font-size:14px}.flow-section-head{margin-bottom:10px}}

@media(max-width:1020px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:80;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.kpi-grid,.module-grid,.two-col,.three-col,.catalog-grid{grid-template-columns:1fr}.topbar{height:auto;padding:14px;align-items:flex-start}.top-actions{justify-content:flex-start}.content{padding:14px}.form-grid{grid-template-columns:1fr}.search{min-width:180px}.span-2,.span-3{grid-column:auto}}
@media print{body{height:auto;overflow:visible;background:white}.app,.modal-backdrop{display:none}.print-only{display:block!important}.print-doc{display:block!important}.no-print{display:none!important}}
.clickable-card{cursor:pointer;transition:.15s}.clickable-card:hover{transform:translateY(-2px);border-color:#aad5b4}.clickable-card:active{transform:translateY(0)}.alert.clickable-card{cursor:pointer}

.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.calendar-title{font-size:20px;font-weight:900}
.calendar-actions{display:flex;gap:8px;flex-wrap:wrap}
.calendar-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.calendar-dow div{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.calendar .day{position:relative;min-height:118px}
.calendar .day.other-month{background:#f7faf6;color:#9aa7a0}
.calendar .day.today{border-color:var(--green);box-shadow:0 0 0 2px rgba(31,107,58,.12)}
.calendar .day.has-event{cursor:pointer}
.calendar .day .num{display:flex;align-items:center;justify-content:space-between;gap:6px}
.calendar .day .add-day{border:0;background:var(--green2);color:var(--green);border-radius:999px;width:24px;height:24px;font-weight:900;cursor:pointer}
.calendar .event{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar .event.job{background:#e9f1fb;color:var(--blue)}
.calendar .event.done{background:#e9f8ee;color:var(--green)}
.calendar .event.cancelled{background:#fdeaea;color:var(--red)}
.calendar-list{margin-top:16px}
.calendar-list .card h3{margin-bottom:4px}
@media(max-width:760px){
  .calendar{grid-template-columns:1fr}
  .calendar-dow{display:none}
  .calendar .day.other-month{display:none}
}


.btn.danger,.btn.small.danger{background:#b42318;color:#fff;border-color:#b42318}
.btn.danger:hover,.btn.small.danger:hover{background:#8f1d13}


/* v20 Supabase model readiness additions */
.line-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.line-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f8faf8;border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted)}
.location-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.location-card{border:1px solid var(--line);background:#fbfcfb;border-radius:12px;padding:8px;font-size:12px}
.warning-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.supabase-note{background:#eef7ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.table-wrap .btn.micro{font-size:11px;padding:5px 8px}


/* v22 archive/deactivate workflow fixed */
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.filter-row .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.filter-row .seg button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.filter-row .seg button.active{background:var(--green);color:#fff}
.status-muted{opacity:.58}
.action-note{font-size:12px;color:var(--muted);margin-top:4px}
.btn.warn,.btn.small.warn,.btn.micro.warn{background:#f59e0b;color:#fff;border-color:#f59e0b}
.btn.warn:hover,.btn.small.warn:hover,.btn.micro.warn:hover{background:#d97706}
.btn.reverse,.btn.small.reverse,.btn.micro.reverse{background:#7c3aed;color:#fff;border-color:#7c3aed}
.btn.reverse:hover,.btn.small.reverse:hover,.btn.micro.reverse:hover{background:#6d28d9}
.lifecycle-note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}


/* v23 print/email workflow */
.print-email-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.email-preview-box{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;max-height:260px;overflow:auto}
@media print{
  .sidebar,.topbar,.toolbar,.print-email-bar,.btn,.filter-row,.calendar-actions,.nav,.modal-backdrop{display:none!important}
  .main,.content,.card,.table-wrap{box-shadow:none!important;border:none!important}
  body{background:white!important}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid;page-break-after:auto}
}


/* v24 dependency drilldown */
.dep-list{display:flex;flex-direction:column;gap:10px}
.dep-group{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.dep-group h3{margin:0;padding:11px 12px;background:#f8faf8;border-bottom:1px solid var(--line);font-size:14px}
.dep-row{display:grid;grid-template-columns:1.2fr 1fr .8fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.dep-row:last-child{border-bottom:0}
.dep-row .muted{color:var(--muted);font-size:12px}
.dep-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:760px){.dep-row{grid-template-columns:1fr}.dep-actions{justify-content:flex-start}}


/* v25 Home Command Center */
.command-hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:16px}
.command-panel{background:linear-gradient(135deg,#12351f,#1f6b3a);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.command-panel::after{content:'';position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:999px;background:rgba(255,255,255,.08)}
.command-panel h2{font-size:28px;margin:0 0 8px;letter-spacing:-.03em}
.command-panel p{color:rgba(255,255,255,.78);max-width:720px;line-height:1.45;margin:0 0 16px}
.command-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.command-actions .btn{background:#fff;color:#1f6b3a;border-color:#fff;font-weight:900}
.command-actions .btn.secondary{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.health-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.health-score{display:flex;align-items:center;justify-content:space-between;gap:14px}
.score-ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--score)*1%),#e8eee8 0);display:flex;align-items:center;justify-content:center;position:relative}
.score-ring::before{content:'';position:absolute;width:76px;height:76px;border-radius:50%;background:#fff}
.score-ring span{position:relative;font-size:28px;font-weight:1000;color:var(--green)}
.health-card h3{margin:0 0 4px}
.health-card p{margin:0;color:var(--muted);font-size:13px}
.command-grid{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.command-kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 18px rgba(18,50,20,.04);cursor:pointer;transition:.15s}
.command-kpi:hover{transform:translateY(-2px);border-color:#b7d9c0;box-shadow:0 12px 22px rgba(18,50,20,.08)}

const DB_URL = '/.netlify/functions/db';

async function dbCall(action, table, payload = {}) {
  try {
    const res = await fetch(DB_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, table, ...payload })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'DB error');
    return json.data;
  } catch (e) {

    return null;
  }
}

// ── doLogin() — PASO 4 ──────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');

  if (!email || !password) {
    errEl.textContent = 'Please enter email and password.';
    return;
  }

  btn.textContent = 'Signing in…';
  btn.disabled = true;
  errEl.textContent = '';

  // ── LOCAL USERS — funciona sin Supabase ──────────────────
  const LOCAL_USERS = [
    { id:'USR-0001', name:'Admin',   email:'admin@empresa.com',   password:'admin123', role:'Admin',    language:'en' },
    { id:'USR-0002', name:'Manager', email:'manager@empresa.com', password:'pass123',  role:'Manager',  language:'en' },
    { id:'USR-0003', name:'Billing', email:'billing@empresa.com', password:'pass123',  role:'Billing',  language:'en' }
  ];

  try {
    let user = null;
    const cloudUser = await dbCall('login', null, { data: { email, password } });
    if (cloudUser) {
      user = cloudUser;
    } else {
      user = LOCAL_USERS.find(u => u.email === email && u.password === password) || null;
    }

    if (!user) {
      errEl.textContent = 'Invalid credentials. Try again.';
      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }

    currentUser = user;

    btn.textContent = 'Loading data…';
    const cloudData = await loadFromSupabase();
    if (cloudData && cloudData.customers !== undefined) {
      db = cloudData;
      try { localStorage.setItem(storageKey, JSON.stringify(db)); } catch(e) {}
    } else {
      db = load();
    }

    state.role = user.role || 'Admin';
    state.lang = user.language || 'en';

    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('main-app').style.display = '';
    document.body.style.overflow = '';
    if (cloudUser) {
      const pill = document.getElementById('local-mode-pill');
      if (pill) pill.style.display = 'none';
    }

    const footerEl = document.querySelector('.sidebar-footer');
    if (footerEl) {
      const noteEl = footerEl.querySelector('.footer-note');
      if (noteEl) noteEl.textContent = `${user.name} · ${user.role}`;
    }

    const _req=['customers','addresses','vendors','services','stores','jobs','estimates','estimate_lines','invoices','invoice_lines','payments','expenses','bills','inventory','tasks','users','auditLog','audits','contractors','employees','teams','calendar'];
    _req.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[];});
    if(!db.company)db.company={};
    if(!db.catalogs)db.catalogs={};
    navigate('dashboard');

  } catch (e) {
    console.error('Login error:', e);
    errEl.textContent = 'Connection error. Check your internet.';
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
}

let _pendingSync = new Set();
let _syncTimer = null;
function markDirty(table, id) {
  _pendingSync.add(`${table}:${id}`);
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(flushDirty, 800);
}
async function flushDirty() {
  const pending = [..._pendingSync];
  _pendingSync.clear();
  for (const key of pending) {
    const [table, id] = key.split(':');
    const record = findRecord(db, table, id);
    if (record) await dbCall('upsert', table, { data: record });
  }
}
function findRecord(db, table, id) {
  if (!Array.isArray(db[table])) return null;
  return db[table].find(r => r.id === id) || null;
}

function recalcInvoicePaymentStatus(invoiceId){
 const inv=db.invoices.find(i=>i.id===invoiceId); if(!inv)return;
 const payments=db.payments.filter(p=>p.invoiceId===invoiceId).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.id||'').localeCompare(b.id||''));
 const total=+inv.total||0, writeOff=+inv.writeOff||0;
 let runningPaid=0;
 payments.forEach(p=>{
  const amt=+p.amount||0;
  p.origAmt=total;
  p.amountDue=Math.max(0,total-writeOff-runningPaid);
  runningPaid+=amt;
  p.remaining=Math.max(0,total-writeOff-runningPaid);
 });
 inv.paid=payments.reduce((a,p)=>a+(+p.amount||0),0);
 const bal=invoiceBalance(inv);
 inv.status=bal<=0?'Paid':(inv.paid>0?'Partially Paid':(new Date(inv.due)<new Date()?'Overdue':(inv.status==='Draft'?'Draft':'Sent')));
}

 const invId=document.getElementById(prefix+'-invoice')?.value;
 const inv=db.invoices.find(i=>i.id===invId); if(!inv)return;
 const currentPaymentId=document.getElementById(prefix+'-payment-id')?.value||'';
 const orig=+inv.total||0;
 const otherPaid=db.payments.filter(p=>p.invoiceId===inv.id&&p.id!==currentPaymentId).reduce((a,p)=>a+(+p.amount||0),0);
 const amountDue=Math.max(0,orig-otherPaid-(+inv.writeOff||0));
 const payAmount=+document.getElementById(prefix+'-amount')?.value||0;
 const remaining=Math.max(0,amountDue-payAmount);
 ['orig','dueamt','remaining'].forEach(k=>{const el=document.getElementById(prefix+'-'+k); if(el)el.value=(k==='orig'?orig:k==='dueamt'?amountDue:remaining).toFixed(2);});

}

function ensureV20Data(){
  if(!db.customerLocations) db.customerLocations=[];
  if(!db.estimateLines) db.estimateLines=[];
  if(!db.invoiceLines) db.invoiceLines=[];
  if(!db.catalogs) db.catalogs={};
  if(!db.catalogs.recurrenceTypes) db.catalogs.recurrenceTypes=['None','Weekly','Bi-weekly','Monthly','Custom'];
  if(!db.catalogs.locationTypes) db.catalogs.locationTypes=['Billing','Service','Home','Office','Warehouse','Other'];

  (db.customers||[]).forEach(c=>{
    const exists=db.customerLocations.some(l=>l.customerId===c.id);
    if(!exists){
      db.customerLocations.push({
        id:uid('LOC'),
        customerId:c.id,
        locationName:'Default Service Location',
        locationType:'Service',
        address:c.address||'',
        city:'',
        state:'TX',
        postalCode:'',
        accessNotes:'',
        isDefault:true,
        status:'Active'
      });
    }
  });

  (db.estimates||[]).forEach(e=>{
    const has=db.estimateLines.some(l=>l.estimateId===e.id);
    if(!has){
      const desc=e.notes||'Cleaning service';
      const subtotal=+e.subtotal||(+e.total||0)/(1+(+db.company.taxRate||0)/100);
      db.estimateLines.push({
        id:uid('ELN'),estimateId:e.id,lineNumber:1,itemId:'',serviceId:(db.services&&db.services[0]?.id)||'',description:desc,quantity:1,unitPrice:+subtotal.toFixed(2),taxCode:'TAX',taxAmount:+((subtotal*(+db.company.taxRate||0)/100)).toFixed(2),lineTotal:+((subtotal)*(1+(+db.company.taxRate||0)/100)).toFixed(2),status:'Active'
      });
    }
  });

  (db.invoices||[]).forEach(i=>{
    const has=db.invoiceLines.some(l=>l.invoiceId===i.id);
    if(!has){
      const desc=i.memo||i.notes||'Cleaning service';
      const subtotal=+i.subtotal||(+i.total||0)/(1+(+db.company.taxRate||0)/100);
      db.invoiceLines.push({
        id:uid('ILN'),invoiceId:i.id,lineNumber:1,itemId:'',serviceId:(db.services&&db.services[0]?.id)||'',description:desc,quantity:1,unitPrice:+subtotal.toFixed(2),taxCode:'TAX',taxAmount:+((subtotal*(+db.company.taxRate||0)/100)).toFixed(2),lineTotal:+((subtotal)*(1+(+db.company.taxRate||0)/100)).toFixed(2),status:'Active'
      });
    }
  });

  (db.calendar||[]).forEach(e=>{
    if(!e.recurrence)e.recurrence='None';
    if(e.status==='Deleted')e.status='Cancelled';
  });
  (db.jobs||[]).forEach(j=>{
    if(j.status==='Deleted')j.status='Cancelled';
  });
  save(db);
}

function lineList(type,id){
  const key=type==='estimate'?'estimateLines':'invoiceLines';
  return (db[key]||[]).filter(l=>l[(type==='estimate'?'estimateId':'invoiceId')]===id&&l.status!=='Archived').sort((a,b)=>(+a.lineNumber||0)-(+b.lineNumber||0));
}
function recalcDocFromLines(type,id){
  const headerKey=type==='estimate'?'estimates':'invoices';
  const lines=lineList(type,id);
  const rec=(db[headerKey]||[]).find(x=>x.id===id);
  if(!rec)return;
  const subtotal=lines.reduce((a,l)=>a+(+l.quantity||0)*(+l.unitPrice||0),0);
  const tax=lines.reduce((a,l)=>a+(+l.taxAmount||0),0);
  rec.subtotal=+subtotal.toFixed(2);
  rec.tax=+tax.toFixed(2);
  rec.total=+(subtotal+tax).toFixed(2);
  if(type==='invoice')recalcInvoicePaymentStatus(rec.id);
}
function lineTotalsHtml(type,id){
  const lines=lineList(type,id);
  const subtotal=lines.reduce((a,l)=>a+(+l.quantity||0)*(+l.unitPrice||0),0);
  const tax=lines.reduce((a,l)=>a+(+l.taxAmount||0),0);
  return `<div class="line-summary"><span class="line-pill">${lines.length} line item(s)</span><span class="line-pill">Subtotal ${money(subtotal)}</span><span class="line-pill">Tax ${money(tax)}</span><span class="line-pill">Total ${money(subtotal+tax)}</span></div>`;
}
function openLines(type,id){

  <div class="table-wrap"><table><thead><tr><th>#</th><th>Item/Service</th><th>Description</th><th>Qty</th><th>Unit Price</th><th>Tax</th><th>Total</th><th>Actions</th></tr></thead><tbody>
  ${lines.map(l=>`<tr><td>${l.lineNumber}</td><td>${serviceName(l.serviceId)||l.itemId||''}</td><td>${l.description}</td><td>${l.quantity}</td><td>${money(l.unitPrice)}</td><td>${money(l.taxAmount)}</td><td>${money(l.lineTotal)}</td><td><button class="btn micro secondary" onclick="editLine('${type}','${id}','${l.id}')">Edit</button> <button class="btn micro danger" onclick="archiveLine('${type}','${id}','${l.id}')">Archive</button></td></tr>`).join('')||'<tr><td colspan="8">No lines yet.</td></tr>'}
  </tbody></table></div>${lineTotalsHtml(type,id)}`;
  openModal(title,body,`<button class="btn secondary" onclick="closeModal()">Close</button><button class="btn" onclick="editLine('${type}','${id}','')">+ Add Line</button>`);
}

function editLine(type,docId,lineId=''){
  const key=type==='estimate'?'estimateLines':'invoiceLines';
  const line=lineId?(db[key]||[]).find(l=>l.id===lineId):null;
  const nextNo=line?.lineNumber||(lineList(type,docId).length+1);
  const body=`<div class="form-grid">
    <div class="fg"><label>Line #</label><input id="line-number" type="number" value="${nextNo}"></div>
    <div class="fg"><label>Service</label><select id="line-service">${serviceOptionsForLine(line?.serviceId||'')}</select></div>
    <div class="fg"><label>Store / Item</label><select id="line-item">${itemOptionsForLine(line?.itemId||'')}</select></div>
    <div class="fg"><label>Tax Code</label><input id="line-taxcode" value="${line?.taxCode||'TAX'}"></div>
    <div class="fg span-2"><label>Description</label><input id="line-desc" value="${line?.description||''}"></div>
    <div class="fg"><label>Quantity</label><input id="line-qty" type="number" step="0.01" value="${line?.quantity||1}"></div>
    <div class="fg"><label>Unit Price</label><input id="line-price" type="number" step="0.01" value="${line?.unitPrice||0}"></div>
  </div>`;
  openModal(lineId?'Edit Line Item':'Add Line Item',body,`<button class="btn secondary" onclick="openLines('${type}','${docId}')">Back</button><button class="btn" onclick="saveLine('${type}','${docId}','${lineId}')">Save Line</button>`);
}
function saveLine(type,docId,lineId=''){
  const key=type==='estimate'?'estimateLines':'invoiceLines';
  const fk=type==='estimate'?'estimateId':'invoiceId';
  const idx=lineId?(db[key]||[]).findIndex(l=>l.id===lineId):-1;
  const qty=+document.getElementById('line-qty').value||0;
  const price=+document.getElementById('line-price').value||0;
  const subtotal=qty*price;
  const taxCode=document.getElementById('line-taxcode').value||'TAX';
  const tax=taxCode.toUpperCase()==='NON'||taxCode.toUpperCase()==='NON-TAX'?0:subtotal*(+db.company.taxRate||0)/100;
  const record={
    id:lineId||uid(type==='estimate'?'ELN':'ILN'),
    [fk]:docId,
    lineNumber:+document.getElementById('line-number').value||1,
    itemId:document.getElementById('line-item').value,
    serviceId:document.getElementById('line-service').value,
    description:document.getElementById('line-desc').value||'Line item',
    quantity:qty,
    unitPrice:price,
    taxCode,
    taxAmount:+tax.toFixed(2),
    lineTotal:+(subtotal+tax).toFixed(2),
    status:'Active'
  };
  if(idx>=0){const before={...db[key][idx]}; db[key][idx]=record; log(key,'Edit',before,record);}
  else{db[key].push(record); log(key,'Create',null,record);}
  recalcDocFromLines(type,docId);
  save(db);
  openLines(type,docId);
}
function archiveLine(type,docId,lineId){
  const key=type==='estimate'?'estimateLines':'invoiceLines';
  const line=(db[key]||[]).find(l=>l.id===lineId);
  if(!line)return;
  if(!confirm('Archive this line item? / ¿Archivar esta línea?'))return;
  const before={...line}; line.status='Archived'; log(key,'Archive',before,line);
  recalcDocFromLines(type,docId); save(db); openLines(type,docId);
}

 return `<div class="card clickable">

function monthlyCalendarDays(){
 const first=calendarBaseMonth();
 const start=new Date(first);
 start.setDate(1-first.getDay());
 const todayIso=today(0);
 let html='';
 for(let i=0;i<42;i++){
   const d=new Date(start); d.setDate(start.getDate()+i);
   const iso=isoDate(d);
   const evs=eventsForDate(iso);
   const other=d.getMonth()!==first.getMonth();
   const classes=['day',other?'other-month':'',iso===todayIso?'today':'',evs.length?'has-event':''].filter(Boolean).join(' ');
   html+=`<div class="${classes}">
     <div class="num"><span>${d.getDate()}</span><button class="add-day" title="Add event" onclick="openCalendarForm(null,'${iso}')">+</button></div>
     ${evs.slice(0,4).map(e=>`<div class="event ${e._kind==='job'?'job':''} ${String(e.status).toLowerCase().includes('completed')?'done':''} ${String(e.status).toLowerCase().includes('cancel')?'cancelled':''}" title="Click to open / Double click to cancel" onclick="${e._kind==='calendar' ? `openCalendarForm('${e.id}')` : `openCalendarJob('${e.id}')`}" ondblclick="event.stopPropagation();cancelCalendarEntry('${e._kind}','${e.id}')">${e.time||''} ${e.customer||''}</div>`).join('')}
     ${evs.length>4?`<div class="event">+${evs.length-4} more</div>`:''}
   </div>`;
 }
 return html;
}

function saveCalendarEvent(id=''){
  if(!db.calendar) db.calendar=[];
  let customer = calendarFieldValue('cal-customer');

    if(!name){alert('Customer name is required / Nombre del cliente requerido');return}
    const c={id:uid('CUS'),name,type:calendarFieldValue('cal-new-customer-type')||'Commercial',contact:name,email:calendarFieldValue('cal-new-customer-email'),phone:calendarFieldValue('cal-new-customer-phone'),address:calendarFieldValue('cal-location'),terms:'Net 15',lang:state.lang,status:'Active',credit:0};
    db.customers.unshift(c); log('Customers','Create from Calendar',null,c); customer=name;
  }
  const rec={id:id||uid('CAL'),customer,service:calendarFieldValue('cal-service')||'Other',date:calendarFieldValue('cal-date'),time:calendarFieldValue('cal-time')||'09:00',status:calendarFieldValue('cal-status')||'Scheduled',recurrence:calendarFieldValue('cal-recurrence')||'None',assigned:calendarFieldValue('cal-assigned')||'Field Team',location:calendarFieldValue('cal-location'),notes:calendarFieldValue('cal-notes')};
  if(!rec.customer || !rec.date){alert('Customer and date are required / Cliente y fecha son requeridos');return}
  if(id){const idx=db.calendar.findIndex(x=>x.id===id); if(idx>=0){const before={...db.calendar[idx]}; db.calendar[idx]=rec; log('Calendar','Edit',before,rec);}}
  else{db.calendar.unshift(rec); log('Calendar','Create',null,rec);}
  ensureV20Data(); save(db); closeModal(); requestAnimationFrame(()=>navigate('calendar', true));
}

(function(){

(function(){

  };
  window.printDocument=function(type,id){
    try{

    var c=(db.customers||[]).find(function(x){return x.id===customerId});

  };
  window.findCustomerNameSafe=function(customerId){
    try{return customerName(customerId)||'Customer'}catch(e){return 'Customer'}
  };
  window.getDocRecord=function(type,id){
    var list=type==='estimate'?(db.estimates||[]):(db.invoices||[]);
    return list.find(function(x){return x.id===id})||null;
  };
  window.getDocLines=function(type,id){
    var key=type==='estimate'?'estimateLines':'invoiceLines';

  };
  window.buildDocumentEmail=function(type,id){
    var rec=getDocRecord(type,id);
    if(!rec)return null;
    var docLabel=type==='estimate'?'Estimate':'Invoice';
    var customer=findCustomerNameSafe(rec.customerId);
    var to=findCustomerEmail(rec.customerId);
    var total=money(rec.total||0);
    var balance=type==='invoice'?money(typeof invoiceBalance==='function'?invoiceBalance(rec):(rec.balance||rec.balanceDue||0)):'';
    var lines=getDocLines(type,id);
    var lineText=lines.length?lines.map(function(l){
      return `- ${l.description||'Line item'} | Qty: ${l.quantity||1} | Unit: ${money(l.unitPrice||0)} | Total: ${money(l.lineTotal||0)}`;
    }).join('\\n'):'- Service details included in the attached/printed document.';
    var subject=`${docLabel} ${rec.id} from ${getCompanyName()}`;
    var body=`Hello ${customer},

Please find below the summary for ${docLabel.toLowerCase()} ${rec.id}.

${docLabel}: ${rec.id}
Date: ${rec.date||rec.estimate_date||rec.invoice_date||''}
Due Date: ${rec.due||rec.due_date||''}
Total: ${total}${type==='invoice'?`\\nBalance Due: ${balance}`:''}

Line Items:
${lineText}

Memo:
${rec.memo||rec.notes||''}

Thank you,
${getCompanyName()}`;
    return {to,subject,body};
  };
  window.openEmailComposer=function(type,id){
    var draft=buildDocumentEmail(type,id);
    if(!draft){alert('Document not found');return;}
    var body=`<div class="supabase-note">Local mockup email mode: this opens your default email app using mailto. For real cloud sending, use Netlify Functions, Supabase Edge Functions, SendGrid, Resend, or Mailgun.</div>
    <div class="form-grid">
      <div class="fg span-2"><label>To</label><input id="email-to" value="${draft.to||''}" placeholder="client@email.com"></div>
      <div class="fg span-2"><label>Subject</label><input id="email-subject" value="${draft.subject.replace(/"/g,'&quot;')}"></div>
      <div class="fg span-2"><label>Body</label><textarea id="email-body" style="min-height:220px">${draft.body}</textarea></div>
    </div>
    <div class="email-preview-box">${draft.body}</div>`;
    openModal('Email Draft / Borrador de Email',body,`<button class="btn secondary" onclick="closeModal()">Close</button><button class="btn secondary" onclick="copyEmailDraft()">Copy</button><button class="btn" onclick="openMailClient()">Open Email App</button>`);
  };
  window.openGenericEmailComposer=function(){
    var subject=`BRUNO360 Business Cleaning Suite - Information`;
    var body=`Hello,

Please see the information from BRUNO360 Business Cleaning Suite.

Thank you,
${getCompanyName()}`;
    var modalBody=`<div class="form-grid">
      <div class="fg span-2"><label>To</label><input id="email-to" placeholder="client@email.com"></div>
      <div class="fg span-2"><label>Subject</label><input id="email-subject" value="${subject}"></div>
      <div class="fg span-2"><label>Body</label><textarea id="email-body" style="min-height:220px">${body}</textarea></div>
    </div>`;
    openModal('Email Draft / Borrador de Email',modalBody,`<button class="btn secondary" onclick="closeModal()">Close</button><button class="btn secondary" onclick="copyEmailDraft()">Copy</button><button class="btn" onclick="openMailClient()">Open Email App</button>`);
  };
  window.openMailClient=function(){
    var to=(document.getElementById('email-to')||{}).value||'';
    var subject=(document.getElementById('email-subject')||{}).value||'';
    var body=(document.getElementById('email-body')||{}).value||'';
    var url=`mailto:${escEmail(to)}?subject=${escEmail(subject)}&body=${escEmail(body)}`;
    window.location.href=url;
  };
  window.copyEmailDraft=async function(){
    var to=(document.getElementById('email-to')||{}).value||'';
    var subject=(document.getElementById('email-subject')||{}).value||'';
    var body=(document.getElementById('email-body')||{}).value||'';
    var text=`To: ${to}\\nSubject: ${subject}\\n\\n${body}`;
    try{
      await navigator.clipboard.writeText(text);

      prompt('Copy this email draft:', text);

  window.openDependencies=function(module,id){

    if(groups.length){

  window.openDependencyRecord=function(module,id){

      setTimeout(function(){

          if(typeof navigate==='function') navigate('calendar');

          return;
        }
        if(module==='jobs'){
          if(typeof navigate==='function') navigate('calendar');
          setTimeout(function(){ if(typeof openCalendarJob==='function') openCalendarJob(id); else if(typeof openEdit==='function') openEdit('jobs',id); },150);

          if(typeof navigate==='function') navigate('invoices');

          return;

        if(module==='estimates'){

          if(typeof navigate==='function') navigate('inventory');

(function(){
  function list(name){return Array.isArray(db&&db[name])?db[name]:[]}
  function todayIso(){try{return today(0)}catch(e){return new Date().toISOString().slice(0,10)}}
  function datePlus(days){var d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10)}
  function safeBal(inv){try{return invoiceBalance(inv)}catch(e){return +(inv.balance||inv.balanceDue||0)}}
  function isDoneStatus(s){return String(s||'').toLowerCase().includes('completed')||String(s||'').toLowerCase()==='done'}
  function isCancelled(s){return String(s||'').toLowerCase().includes('cancel')||String(s||'').toLowerCase().includes('void')||String(s||'').toLowerCase().includes('archiv')||String(s||'').toLowerCase().includes('inactive')}
  function active(r){return !(typeof isArchivedLike==='function'&&isArchivedLike(r)) && !isCancelled(r&&r.status)}
  function cust(id){try{return customerName(id)||id||''}catch(e){return id||''}}
  function svc(id){try{return serviceName(id)||id||''}catch(e){return id||''}}
  function money(v){try{return money(v||0)}catch(e){return '$'+Number(v||0).toFixed(2)}}
  function smallBadge(text,color){return `<span class="badge ${color||'bg-blue'}">${text}</span>`}
  window.commandStats=function(){
    var invoices=list('invoices').filter(active);
    var payments=list('payments').filter(active);
    var expenses=list('expenses').filter(active);
    var jobs=list('jobs').filter(active);
    var calendar=list('calendar').filter(active);
    var inventory=list('inventory').filter(active);
    var today=todayIso();
    var next7=datePlus(7);
    var sales=invoices.reduce(function(a,i){return a+(+i.total||0)},0);
    var collected=payments.reduce(function(a,p){return a+(+p.amount||+p.payment_amount||0)},0);
    var ar=invoices.reduce(function(a,i){return a+safeBal(i)},0);
    var exp=expenses.reduce(function(a,e){return a+(+e.amount||0)},0);
    var todayJobs=jobs.filter(function(j){return (j.date||j.job_date)===today});
    var todayEvents=calendar.filter(function(c){return c.date===today});
    var upcomingEvents=calendar.filter(function(c){return c.date>=today && c.date<=next7});
    var completedNotInvoiced=jobs.filter(function(j){return isDoneStatus(j.status)&&!j.invoiceId});
    var lowStock=inventory.filter(function(i){return +(i.qty||i.quantity||i.quantity_on_hand||0)<=+(i.reorder||i.reorder_point||0)});
    var overdue=invoices.filter(function(i){return safeBal(i)>0 && (i.due||i.due_date||'9999-12-31')<today});
    var estimates=list('estimates').filter(active);
    var openEstimates=estimates.filter(function(e){return !String(e.status||'').toLowerCase().includes('convert') && !String(e.status||'').toLowerCase().includes('reject')});
    var score=100;
    score-=Math.min(25,overdue.length*8);
    score-=Math.min(20,completedNotInvoiced.length*7);
    score-=Math.min(15,lowStock.length*5);
    score-=Math.min(15,Math.floor(ar/500)*2);
    score=Math.max(45,Math.min(100,score));
    return {sales,collected,ar,exp,todayJobs,todayEvents,upcomingEvents,completedNotInvoiced,lowStock,overdue,openEstimates,score};
  };
  function kpi(icon,label,value,hint,target){
    var badge=(typeof iconBadge==='function')?iconBadge(target,true):`<span>${icon}</span>`;
    return `<div class="command-kpi" onclick="navigate('${target}')"><div class="top">${badge}<span>${icon}</span></div><div class="value">${value}</div><div class="label">${label}</div><div class="hint">${hint||'Click to review'}</div></div>`;
  }
  function itemRow(title,meta,badgeText,actionHtml,color){
    return `<div class="command-item"><div><strong>${title}</strong><div class="meta">${meta||''}</div></div><div class="command-badges">${badgeText?smallBadge(badgeText,color):''}${actionHtml||''}</div></div>`;
  }
  function section(title,items,empty){
    return `<div class="card"><h3>${title}</h3><div class="command-list">${items.length?items.join(''):`<div class="command-empty">${empty||'No items right now.'}</div>`}</div></div>`;
  }
  window.openQuickInvoice=function(){navigate('invoices'); setTimeout(function(){try{openEdit('invoices','')}catch(e){}},150)}
  window.openQuickEstimate=function(){navigate('estimates'); setTimeout(function(){try{openEdit('estimates','')}catch(e){}},150)}
  window.openQuickCustomer=function(){navigate('customers'); setTimeout(function(){try{openEdit('customers','')}catch(e){}},150)}
  window.openQuickCalendar=function(){navigate('calendar'); setTimeout(function(){try{openCalendarForm()}catch(e){}},150)}
  window.openQuickPayment=function(){navigate('payments')}
  window.openQuickExpense=function(){navigate('expenses'); setTimeout(function(){try{openEdit('expenses','')}catch(e){}},150)}
  views.dashboard=function(){

      var todayJobItems=s.todayJobs.slice(0,5).map(function(j){return itemRow(`${cust(j.customerId)} · ${svc(j.serviceId)}`,`${j.date||j.job_date||''} ${j.time||j.scheduled_start||''} · ${j.team||j.assigned||''}`,j.status||'Job',`<button class="btn micro secondary" onclick="openDependencyRecord('jobs','${j.id}')">Open</button>`,'bg-green')});
      var notInvoiced=s.completedNotInvoiced.slice(0,6).map(function(j){return itemRow(`${cust(j.customerId)} · ${svc(j.serviceId)}`,`Completed ${j.date||j.job_date||''} · Job ${j.id}`,'Needs Invoice',`<button class="btn micro secondary" onclick="navigate('invoices')">Invoice</button>`,'bg-amber')});
      var arItems=s.overdue.slice(0,6).map(function(i){return itemRow(`${i.id} · ${cust(i.customerId)}`,`Due ${i.due||i.due_date||''} · Balance ${money(safeBal(i))}`,'Overdue',`<button class="btn micro secondary" onclick="openDependencyRecord('invoices','${i.id}')">Open</button>`,'bg-red')});
      var stockItems=s.lowStock.slice(0,6).map(function(i){return itemRow(`${i.name||i.item_name||i.sku}`,`Qty ${i.qty||i.quantity||i.quantity_on_hand||0} · Reorder ${i.reorder||i.reorder_point||0}`,'Low Stock',`<button class="btn micro secondary" onclick="openDependencyRecord('inventory','${i.id}')">Open</button>`,'bg-amber')});
      var upcoming=s.upcomingEvents.slice(0,6).map(function(e){return itemRow(`${e.date} ${e.time||''} · ${e.customer||''}`,`${e.service||''} · ${e.assigned||'Field Team'}`,e.status||'Scheduled',`<button class="btn micro secondary" onclick="openCalendarForm('${e.id}')">Open</button>`,'bg-blue')});
      return `<div class="audit-ribbon">v25 audited delivery: Home Command Center added. Validate dashboard, quick actions, KPI navigation, and section drilldowns before moving to v26.</div>
      <div class="command-hero">
        <div class="command-panel">
          <h2>BRUNO360 Command Center</h2>
          <p>One place to see what is happening today, what needs action, where cash is stuck, and what must be invoiced next.</p>
          <div class="command-actions">
            <button class="btn" onclick="openQuickCustomer()">+ Customer</button>
            <button class="btn" onclick="openQuickEstimate()">+ Estimate</button>
            <button class="btn" onclick="openQuickInvoice()">+ Invoice</button>
            <button class="btn" onclick="openQuickCalendar()">+ Schedule Job</button>
            <button class="btn secondary" onclick="openQuickPayment()">Record Payment</button>
            <button class="btn secondary" onclick="openQuickExpense()">Add Expense</button>
          </div>
        </div>
        <div class="health-card">
          <div class="health-score">
            <div>
              <h3>Business Health Score</h3>
              <p>Based on overdue AR, completed-not-invoiced, and low stock risks.</p>
            </div>
            <div class="score-ring" style="--score:${s.score}"><span>${s.score}</span></div>
          </div>
        </div>
      </div>

      <div class="priority-strip">
        <div class="priority-card" onclick="navigate('calendar')"><h3>Today's Schedule</h3><div class="big">${s.todayEvents.length+s.todayJobs.length}</div><div class="desc">events and jobs planned today</div></div>
        <div class="priority-card" onclick="navigate('invoices')"><h3>Completed Not Invoiced</h3><div class="big">${s.completedNotInvoiced.length}</div><div class="desc">potential revenue waiting for billing</div></div>
        <div class="priority-card" onclick="navigate('inventory')"><h3>Low Stock Alerts</h3><div class="big">${s.lowStock.length}</div><div class="desc">items at or below reorder point</div></div>
      </div>

      <div class="command-grid">
        ${kpi('💰','Sales',money(s.sales),'Invoice total','invoices')}
        ${kpi('✅','Collected',money(s.collected),'Payments received','payments')}
        ${kpi('⏳','Open AR',money(s.ar),'Unpaid invoice balance','invoices')}
        ${kpi('💳','Expenses',money(s.exp),'Posted/active expenses','expenses')}
        ${kpi('🧾','Open Estimates',s.openEstimates.length,'Quotes not converted','estimates')}
        ${kpi('📅','Next 7 Days',s.upcomingEvents.length,'Scheduled events','calendar')}
        ${kpi('⚠️','Overdue',s.overdue.length,'Invoices past due','invoices')}
        ${kpi('📦','Inventory Risk',s.lowStock.length,'Low stock items','inventory')}
      </div>

      <div class="command-sections">
        ${section('Today / Hoy',[].concat(todayItems,todayJobItems),'No events or jobs scheduled today.')}
        ${section('Completed Not Invoiced',notInvoiced,'No completed jobs waiting for invoice.')}

(function(){

      customerTypes:['Residential','Commercial','Office','Industrial','Medical','Retail','Other'],
      vendorCategories:['Supplies','Equipment Repair','Contractor','Insurance','Software','Fuel','Payroll','Other'],
      serviceTypes:['Residential','Commercial','Both','Special Project','Recurring','Move-In/Move-Out'],
      servicePricingTypes:['fixed','hourly','custom_contract','per_sq_ft','per_visit'],
      storeItemTypes:['Service','Product','Bundle','Discount','Other Charge'],
      salesTaxCodes:['TX-8.25','NON','EXEMPT'],
      accounts:['Cleaning Income','Supply Sales','Fee Income','Discounts Given','Other Income'],
      expenseCategories:['Gas','Supplies','Equipment','Uniforms','Repairs','Insurance','Software','Phone','Other'],
      inventoryCategories:['Chemical','Consumable','Equipment','Tool','Uniform','Office','Other'],
      inventoryTypes:['Supply','Equipment','Asset','Consumable','Tool'],
      taskOwners:['Admin','Manager','Billing','Field Team','Sales'],
      taskPriorities:['Low','Normal','High','Urgent'],
      recordStatuses:['Active','Inactive','Archived'],
      taskStatuses:['Open','In Progress','Completed','Cancelled','Archived'],
      expenseStatuses:['Pending Review','Reviewed','Rejected','Voided'],
      serviceStatuses:['Active','Inactive'],
      itemStatuses:['Active','Inactive'],

    };
    Object.keys(defaults).forEach(function(k){
      if(!Array.isArray(db.catalogs[k]) || !db.catalogs[k].length) db.catalogs[k]=defaults[k];
    });
    save(db);
  }
  function optionsFromCatalog(key,selected,allowBlank=false){
    ensureOperationalCatalogs();
    var opts=(db.catalogs[key]||[]).slice();
    var current=selected||'';
    if(current && !opts.includes(current)) opts.unshift(current);
    return (allowBlank?'<option value=""></option>':'')+opts.map(function(x){return `<option value="${x}" ${String(x)===String(current)?'selected':''}>${x}</option>`}).join('');
  }
  function selectField(id,label,catalogKey,selected,span=false,allowBlank=false){
    return `<div class="fg ${span?'span-2':''}"><label>${label}</label><select id="${id}">${optionsFromCatalog(catalogKey,selected,allowBlank)}</select></div>`;
  }
  function inputField(id,label,value='',type='text',span=false){
    return `<div class="fg ${span?'span-2':''}"><label>${label}</label><input id="${id}" type="${type}" value="${String(value??'').replaceAll('"','&quot;')}" ${type==='number'?'step="0.01"':''}></div>`;
  }
  function textareaField(id,label,value='',span=true){
    return `<div class="fg ${span?'span-2':''}"><label>${label}</label><textarea id="${id}">${value??''}</textarea></div>`;
  }
  function selectCustomers(id,selected='',optional=false){
    return `<div class="fg"><label>Customer</label><select id="${id}">${optional?'<option value="">General / None</option>':''}${(db.customers||[]).map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${c.name} (${c.id})</option>`).join('')}</select></div>`;

  function selectVendors(id,selected=''){
    return `<div class="fg"><label>Vendor</label><select id="${id}">${(db.vendors||[]).map(v=>`<option value="${v.id}" ${selected===v.id?'selected':''}>${v.name} (${v.id})</option>`).join('')}</select></div>`;
  }
  function selectServices(id,selected=''){
    return `<div class="fg"><label>Service</label><select id="${id}">${(db.services||[]).map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${s.name} (${s.id})</option>`).join('')}</select></div>`;
  }

  window.catalogFieldFor=function(module,field,value,prefix){
    prefix=prefix||'f-';
    var id=prefix+field;
    var label=field.replace(/([A-Z])/g,' $1').replace(/^./,m=>m.toUpperCase());
    if(module==='customers' && field==='type') return selectField(id,'Type / Tipo','customerTypes',value);
    if(module==='vendors' && field==='category') return selectField(id,'Category / Categoría','vendorCategories',value);
    if(module==='services' && field==='type') return selectField(id,'Type / Tipo','serviceTypes',value);
    if(module==='services' && field==='pricing') return selectField(id,'Pricing / Precio Tipo','servicePricingTypes',value);
    if(module==='services' && field==='status') return selectField(id,'Status','serviceStatuses',value||'Active');
    if(module==='stores' && (field==='activeStatus'||field==='active_status'||field==='activeStatus')) return selectField(id,'Active Status','itemStatuses',value||'Active');
    if(module==='stores' && field==='type') return selectField(id,'Type / Tipo','storeItemTypes',value);

(function(){

  function serviceNameSafe(id){try{return serviceName(id)||id||''}catch(e){return id||''}}
  function todayIso(){try{return today(0)}catch(e){return new Date().toISOString().slice(0,10)}}
  function isCompleted(s){return String(s||'').toLowerCase().includes('completed')||String(s||'').toLowerCase()==='done'}
  function custLocations(id){return rows('customerLocations').filter(function(l){return l.customerId===id && active(l)})}

  function custEstimates(id){return rows('estimates').filter(function(e){return e.customerId===id})}
  function custPayments(id){
    var invoices=custInvoices(id).map(function(i){return i.id});
    return rows('payments').filter(function(p){return invoices.includes(p.invoiceId) || p.customerId===id || p.customer===customerNameSafe(id)})
  }
  function custJobs(id){return rows('jobs').filter(function(j){return j.customerId===id})}
  function custCalendar(id){
    var cname=customerNameSafe(id);

  }
  function datesFromCustomer(id){
    var jobDates=custJobs(id).map(function(j){return j.date||j.job_date}).filter(Boolean);
    var calDates=custCalendar(id).map(function(c){return c.date}).filter(Boolean);
    var all=jobDates.concat(calDates).sort();
    var today=todayIso();
    var past=all.filter(function(d){return d<today}).sort();
    var future=all.filter(function(d){return d>=today}).sort();
    return {last:past.length?past[past.length-1]:'-',next:future.length?future[0]:'-'};
  }
  function statusBadgeHtml(s){

    ].filter(Boolean);
    var html=`<div class="customer360-hero">

(function(){
  function money2(v){ try { return money(v||0); } catch(e) { return "$" + Number(v||0).toFixed(2); } }
  function tdy(){ try { return today(0); } catch(e) { return new Date().toISOString().slice(0,10); } }
  function addDays(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
  function cname(id){ try { return customerName(id)||id||""; } catch(e) { return id||""; } }
  function bal(i){ try { return invoiceBalance(i); } catch(e) { return +(i.balance||i.balanceDue||0); } }
  function inactive(r){
    var s=String((r&&r.status)||"").toLowerCase();
    if(typeof isArchivedLike==="function" && isArchivedLike(r)) return true;
    return s.indexOf("cancel")>=0 || s.indexOf("void")>=0 || s.indexOf("archiv")>=0 || s.indexOf("inactive")>=0 || s.indexOf("reversed")>=0;
  }
  function done(s){ s=String(s||"").toLowerCase(); return s.indexOf("completed")>=0 || s==="done" || s==="invoiced"; }
  function monthKey(date){
    if(!date) return "No date";
    var d=String(date).slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(d)) return "No date";
    return d;
  }
  function lastMonths(n){
    var out=[]; var d=new Date();
    for(var i=n-1;i>=0;i--){
      var x=new Date(d.getFullYear(),d.getMonth()-i,1);
      out.push(x.toISOString().slice(0,7));
    }
    return out;
  }
  function scoreColor(score){
    if(score>=85) return "#1f6b3a";
    if(score>=70) return "#d97706";
    return "#b42318";
  }
  function data(){
    var invoices=rows("invoices").filter(function(x){return !inactive(x);});
    var payments=rows("payments").filter(function(x){return !inactive(x);});
    var expenses=rows("expenses").filter(function(x){return !inactive(x);});
    var jobs=rows("jobs").filter(function(x){return !inactive(x);});
    var calendar=rows("calendar").filter(function(x){return !inactive(x);});
    var inventory=rows("inventory").filter(function(x){return !inactive(x);});
    var todayStr=tdy(), next7=addDays(7);
    var sales=invoices.reduce(function(a,i){return a+(+i.total||0);},0);
    var collected=payments.reduce(function(a,p){return a+(+p.amount||+p.payment_amount||0);},0);
    var ar=invoices.reduce(function(a,i){return a+bal(i);},0);
    var exp=expenses.reduce(function(a,e){return a+(+e.amount||0);},0);
    var overdue=invoices.filter(function(i){return bal(i)>0 && String(i.due||i.due_date||"9999-12-31") < todayStr;});
    var completedNoInvoice=jobs.filter(function(j){return done(j.status) && !j.invoiceId;});
    var lowStock=inventory.filter(function(i){return +(i.qty||i.quantity||i.quantity_on_hand||0) <= +(i.reorder||i.reorder_point||0);});
    var upcoming=calendar.filter(function(c){return c.date>=todayStr && c.date<=next7;});
    var todayEvents=calendar.filter(function(c){return c.date===todayStr;});
    var openEstimates=rows("estimates").filter(function(e){return !inactive(e) && String(e.status||"").toLowerCase().indexOf("convert")<0;});
    var score=100;
    score-=Math.min(25,overdue.length*8);
    score-=Math.min(20,completedNoInvoice.length*7);
    score-=Math.min(15,lowStock.length*5);
    score-=Math.min(15,Math.floor(ar/500)*2);
    score-=Math.min(10,openEstimates.length>5?5:0);
    score=Math.max(40,Math.min(100,score));
    return {invoices:invoices,payments:payments,expenses:expenses,jobs:jobs,calendar:calendar,inventory:inventory,sales:sales,collected:collected,ar:ar,exp:exp,overdue:overdue,completedNoInvoice:completedNoInvoice,lowStock:lowStock,upcoming:upcoming,todayEvents:todayEvents,openEstimates:openEstimates,score:score};
  }
  function kpi(label,value,hint,target){
    return `<div class="cc291-kpi" onclick="navigate('${target}')"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`;
  }
  function barRows(items,kind){
    if(!items.length) return `<div class="cc291-empty">No data available.</div>`;
    var max=Math.max.apply(null,items.map(function(x){return Math.abs(x.value)||0;}));
    if(max<=0) max=1;
    return `<div class="cc291-bars">`+items.map(function(x){
      var w=Math.max(4,Math.round((Math.abs(x.value)/max)*100));
      return `<div class="cc291-bar-row"><div class="cc291-bar-label">${x.label}</div><div class="cc291-bar-track"><div class="cc291-bar-fill ${kind||""}" style="--w:${w}%"></div></div><div class="cc291-bar-val">${x.display}</div></div>`;
    }).join("")+`</div>`;
  }
  function monthRevenue(d){
    return lastMonths(6).map(function(m){
      var val=d.invoices.filter(function(i){return monthKey(i.date||i.invoice_date)===m;}).reduce(function(a,i){return a+(+i.total||0);},0);
      return {label:m,value:val,display:money2(val)};
    });
  }
  function expensesByCategory(d){
    var map={};
    d.expenses.forEach(function(e){ var k=e.category||"Other"; map[k]=(map[k]||0)+(+e.amount||0); });
    return Object.keys(map).map(function(k){return {label:k,value:map[k],display:money2(map[k])};}).sort(function(a,b){return b.value-a.value;}).slice(0,6);
  }
  function topCustomers(d){
    var map={};
    d.invoices.forEach(function(i){ var k=i.customerId||"Unknown"; map[k]=(map[k]||0)+(+i.total||0); });
    return Object.keys(map).map(function(k){return {label:cname(k),value:map[k],display:money2(map[k])};}).sort(function(a,b){return b.value-a.value;}).slice(0,6);
  }
  function arAging(d){
    var todayStr=tdy();
    var buckets={current:0,d1:0,d31:0,d61:0};
    d.invoices.forEach(function(i){
      var b=bal(i); if(b<=0) return;
      var due=String(i.due||i.due_date||todayStr);
      var days=Math.round((new Date(todayStr+"T00:00:00")-new Date(due+"T00:00:00"))/86400000);
      if(isNaN(days) || days<=0) buckets.current+=b;
      else if(days<=30) buckets.d1+=b;
      else if(days<=60) buckets.d31+=b;
      else buckets.d61+=b;
    });
    var total=buckets.current+buckets.d1+buckets.d31+buckets.d61 || 1;
    return {
      a:Math.round((buckets.current/total)*100),
      b:Math.round(((buckets.current+buckets.d1)/total)*100),
      c:Math.round(((buckets.current+buckets.d1+buckets.d31)/total)*100),
      buckets:buckets
    };
  }
  function item(title,meta,badgeHtml,actionHtml){
    return `<div class="cc291-item"><div><strong>${title}</strong><div class="meta">${meta||""}</div></div><div class="cc291-item-actions">${badgeHtml||""}${actionHtml||""}</div></div>`;
  }
  function section(title,items,empty){
    return `<div class="cc291-card"><h3>${title}</h3><div class="cc291-list">${items.length?items.join(""):`<div class="cc291-empty">${empty||"No action items."}</div>`}</div></div>`;
  }

  var oldDashboard=views.dashboard;
  views.dashboard=function(){
    try{
      var d=data();
      var color=scoreColor(d.score);
      var aging=arAging(d);
      var overdueItems=d.overdue.slice(0,5).map(function(i){
        return item(`${i.id} · ${cname(i.customerId)}`,`Due ${i.due||i.due_date||""} · Balance ${money2(bal(i))}`,`<span class="badge bg-red">Overdue</span>`,`<button class="btn micro secondary" onclick="openDependencyRecord('invoices','${i.id}')">Open</button>`);
      });
      var stockItems=d.lowStock.slice(0,5).map(function(i){
        return item(`${i.name||i.item_name||i.sku}`,`Qty ${i.qty||i.quantity||i.quantity_on_hand||0} · Reorder ${i.reorder||i.reorder_point||0}`,`<span class="badge bg-amber">Low Stock</span>`,`<button class="btn micro secondary" onclick="navigate('inventory')">Open</button>`);
      });
      var opsItems=d.upcoming.slice(0,5).map(function(e){
        return item(`${e.date||""} ${e.time||""} · ${e.customer||""}`,`${e.service||""} · ${e.assigned||"Field Team"}`,`<span class="badge bg-blue">Scheduled</span>`,`<button class="btn micro secondary" onclick="openCalendarForm('${e.id}')">Open</button>`);
      });
      return `<div class="cc291-wrap">
        <div class="cc291-hero">
          <div class="cc291-hero-inner">
            <div>
              <h2>Command Center</h2>
              <p>Executive view of revenue, collections, operations, inventory risk and action items.</p>
            </div>
            <div class="cc291-actions">
              <button class="btn" onclick="openQuickInvoice()">+ Invoice</button>
              <button class="btn" onclick="openQuickCalendar()">+ Schedule</button>
              <button class="btn secondary" onclick="navigate('payments')">Payments</button>
              <button class="btn secondary" onclick="navigate('reports')">Reports</button>
            </div>
          </div>
        </div>

        <div class="cc291-top">
          <div class="cc291-grid">
            ${kpi("Sales",money2(d.sales),"Invoice total","invoices")}
            ${kpi("Collected",money2(d.collected),"Payments received","payments")}
            ${kpi("Open AR",money2(d.ar),"Unpaid balance","invoices")}
            ${kpi("Expenses",money2(d.exp),"Business expenses","expenses")}
            ${kpi("Today",d.todayEvents.length,"Scheduled events","calendar")}
            ${kpi("Next 7 Days",d.upcoming.length,"Upcoming work","calendar")}
            ${kpi("Low Stock",d.lowStock.length,"Inventory risks","inventory")}
            ${kpi("Open Estimates",d.openEstimates.length,"Quotes pending","estimates")}
          </div>
          <div class="cc291-health">
            <div class="cc291-health-row">
              <div>
                <h3>Business Health Score</h3>
                <p>Calculated from overdue AR, completed jobs without invoice, inventory risk, open AR and quote backlog.</p>
              </div>
              <div class="cc291-score-ring" style="--score:${d.score};--score-color:${color}"><span>${d.score}</span></div>
            </div>
          </div>
        </div>

        <div class="cc291-charts">
          <div class="cc291-card"><h3>Revenue Trend <span class="role-note">Last 6 months</span></h3>${barRows(monthRevenue(d),"")}</div>
          <div class="cc291-card"><h3>Expenses by Category</h3>${barRows(expensesByCategory(d),"warn")}</div>
          <div class="cc291-card"><h3>Top Customers by Revenue</h3>${barRows(topCustomers(d),"")}</div>
          <div class="cc291-card">
            <h3>AR Aging</h3>
            <div class="cc291-donut-wrap">
              <div class="cc291-donut" style="--a:${aging.a}%;--b:${aging.b}%;--c:${aging.c}%"></div>
              <div class="cc291-legend">
                <span><i class="cc291-dot"></i> Current: ${money2(aging.buckets.current)}</span>
                <span><i class="cc291-dot warn"></i> 1-30: ${money2(aging.buckets.d1)}</span>
                <span><i class="cc291-dot danger"></i> 31-60: ${money2(aging.buckets.d31)}</span>
                <span><i class="cc291-dot gray"></i> 61+: ${money2(aging.buckets.d61)}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="cc291-sections">
          ${section("Overdue AR Action List",overdueItems,"No overdue invoices.")}
          ${section("Inventory Risk",stockItems,"No low stock items.")}
          ${section("Upcoming Operations",opsItems,"No upcoming events in the next 7 days.")}
          ${section("Business Focus",[
            item("Collection discipline",`${d.overdue.length} overdue invoice(s) · ${money2(d.ar)} open AR`,`<span class="badge bg-red">Finance</span>`,`<button class="btn micro secondary" onclick="navigate('invoices')">Review</button>`),
            item("Inventory readiness",`${d.lowStock.length} item(s) at or below reorder point`,`<span class="badge bg-amber">Ops</span>`,`<button class="btn micro secondary" onclick="navigate('inventory')">Review</button>`),
            item("Service pipeline",`${d.upcoming.length} event(s) scheduled in next 7 days`,`<span class="badge bg-blue">Calendar</span>`,`<button class="btn micro secondary" onclick="navigate('calendar')">Review</button>`)
          ],"No focus items.")}
        </div>
      </div>`;
    }catch(e){

      return oldDashboard?oldDashboard():`<div class="card">Dashboard error: ${e.message}</div>`;
    }
  };
})();

(function(){

    }

  ensureRichDemoData();

  var prevDashboard=views.dashboard;
  views.dashboard=function(){

      var html=prevDashboard?prevDashboard():'';
      var sales=(db.invoices||[]).reduce(function(a,i){return a+(+i.total||0)},0);
      var collected=(db.payments||[]).reduce(function(a,p){return a+(+p.amount||+p.payment_amount||0)},0);
      var expenses=(db.expenses||[]).reduce(function(a,e){return a+(+e.amount||0)},0);
      var invoiceCount=(db.invoices||[]).length;
      var paymentCount=(db.payments||[]).length;
      var expenseCount=(db.expenses||[]).length;
      var strip='<div class="rich-data-strip"><div><strong>Demo data active:</strong> '+invoiceCount+' invoices · '+paymentCount+' payments · '+expenseCount+' expenses. Sales '+money(sales)+' · Collected '+money(collected)+' · Expenses '+money(expenses)+'</div><button class="btn secondary" onclick="forceRichDemoData()">Reload Rich Demo Data</button></div>';
      return strip+html;

(function(){
  function money29(v){ try { return money(v||0); } catch(e) { return "$" + Number(v||0).toFixed(2); } }
  function today29(){ try { return today(0); } catch(e) { return new Date().toISOString().slice(0,10); } }
  function addDays29(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
  function cname29(id){ try { return customerName(id)||id||""; } catch(e) { return id||""; } }
  function invBal29(i){
    try { return invoiceBalance(i); }
    catch(e) {
      var paid=+i.paid||0;
      if(Array.isArray(db.payments)){
        paid += db.payments.filter(function(p){return p.invoiceId===i.id;}).reduce(function(a,p){return a+(+p.amount||+p.payment_amount||0);},0);
      }
      return Math.max(0,(+i.total||0)-paid-(+i.writeOff||0));
    }
  }
  function inactive29(r){
    var s=String((r&&r.status)||"").toLowerCase();
    if(typeof isArchivedLike==="function" && isArchivedLike(r)) return true;
    return s.indexOf("cancel")>=0 || s.indexOf("void")>=0 || s.indexOf("archiv")>=0 || s.indexOf("inactive")>=0 || s.indexOf("reversed")>=0;
  }
  function done29(s){
    s=String(s||"").toLowerCase();
    return s.indexOf("completed")>=0 || s==="done" || s==="invoiced";
  }
  function monthKey29(date){
    if(!date) return "No date";
    var d=String(date).slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(d)) return "No date";
    return d;
  }
  function lastMonths29(n){
    var out=[]; var d=new Date();
    for(var i=n-1;i>=0;i--){
      var x=new Date(d.getFullYear(),d.getMonth()-i,1);
      out.push(x.toISOString().slice(0,7));
    }
    return out;
  }
  function scoreColor29(score){
    if(score>=85) return "#1f6b3a";
    if(score>=70) return "#d97706";
    return "#b42318";
  }
  function commandData29(){
    var invoices=rows("invoices").filter(function(x){return !inactive29(x);});
    var payments=rows("payments").filter(function(x){return !inactive29(x);});
    var expenses=rows("expenses").filter(function(x){return !inactive29(x);});
    var jobs=rows("jobs").filter(function(x){return !inactive29(x);});
    var calendar=rows("calendar").filter(function(x){return !inactive29(x);});
    var inventory=rows("inventory").filter(function(x){return !inactive29(x);});
    var todayStr=today29(), next7=addDays29(7);
    var sales=invoices.reduce(function(a,i){return a+(+i.total||0);},0);
    var collected=payments.reduce(function(a,p){return a+(+p.amount||+p.payment_amount||0);},0);
    var ar=invoices.reduce(function(a,i){return a+invBal29(i);},0);
    var exp=expenses.reduce(function(a,e){return a+(+e.amount||0);},0);
    var overdue=invoices.filter(function(i){return invBal29(i)>0 && String(i.due||i.due_date||"9999-12-31") < todayStr;});
    var completedNoInvoice=jobs.filter(function(j){return done29(j.status) && !j.invoiceId;});
    var lowStock=inventory.filter(function(i){return +(i.qty||i.quantity||i.quantity_on_hand||0) <= +(i.reorder||i.reorder_point||i.min||0);});
    var upcoming=calendar.filter(function(c){return c.date>=todayStr && c.date<=next7;});
    var todayEvents=calendar.filter(function(c){return c.date===todayStr;});
    var openEstimates=rows("estimates").filter(function(e){
      var s=String(e.status||"").toLowerCase();
      return !inactive29(e) && s.indexOf("convert")<0 && s.indexOf("accepted")<0 && s.indexOf("rejected")<0;
    });
    var score=100;
    score-=Math.min(25,overdue.length*8);
    score-=Math.min(20,completedNoInvoice.length*7);
    score-=Math.min(15,lowStock.length*5);
    score-=Math.min(15,Math.floor(ar/500)*2);
    score-=Math.min(10,openEstimates.length>5?5:0);
    score=Math.max(40,Math.min(100,score));
    return {invoices:invoices,payments:payments,expenses:expenses,jobs:jobs,calendar:calendar,inventory:inventory,sales:sales,collected:collected,ar:ar,exp:exp,overdue:overdue,completedNoInvoice:completedNoInvoice,lowStock:lowStock,upcoming:upcoming,todayEvents:todayEvents,openEstimates:openEstimates,score:score};
  }
  function kpi29(label,value,hint,target){
    return '<div class="cc291-kpi" onclick="navigate(\''+target+'\')"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="hint">'+hint+'</div></div>';
  }
  function barRows29(items,kind){
    if(!items.length) return '<div class="cc291-empty">No data available.</div>';
    var max=Math.max.apply(null,items.map(function(x){return Math.abs(x.value)||0;}));
    if(max<=0) max=1;
    return '<div class="cc291-bars">'+items.map(function(x){
      var w=Math.max(4,Math.round((Math.abs(x.value)/max)*100));
      return '<div class="cc291-bar-row"><div class="cc291-bar-label">'+x.label+'</div><div class="cc291-bar-track"><div class="cc291-bar-fill '+(kind||'')+'" style="--w:'+w+'%"></div></div><div class="cc291-bar-val">'+x.display+'</div></div>';
    }).join('')+'</div>';
  }
  function monthRevenue29(d){
    return lastMonths29(6).map(function(m){
      var val=d.invoices.filter(function(i){return monthKey29(i.date||i.invoice_date)===m;}).reduce(function(a,i){return a+(+i.total||0);},0);
      return {label:m,value:val,display:money29(val)};
    });
  }
  function expensesByCategory29(d){
    var map={};
    d.expenses.forEach(function(e){ var k=e.category||"Other"; map[k]=(map[k]||0)+(+e.amount||0); });
    return Object.keys(map).map(function(k){return {label:k,value:map[k],display:money29(map[k])};}).sort(function(a,b){return b.value-a.value;}).slice(0,6);
  }
  function topCustomers29(d){
    var map={};
    d.invoices.forEach(function(i){ var k=i.customerId||"Unknown"; map[k]=(map[k]||0)+(+i.total||0); });
    return Object.keys(map).map(function(k){return {label:cname29(k),value:map[k],display:money29(map[k])};}).sort(function(a,b){return b.value-a.value;}).slice(0,6);
  }
  function arAging29(d){
    var todayStr=today29();
    var buckets={current:0,d1:0,d31:0,d61:0};
    d.invoices.forEach(function(i){
      var b=invBal29(i); if(b<=0) return;
      var due=String(i.due||i.due_date||todayStr);
      var days=Math.round((new Date(todayStr+"T00:00:00")-new Date(due+"T00:00:00"))/86400000);
      if(isNaN(days) || days<=0) buckets.current+=b;
      else if(days<=30) buckets.d1+=b;
      else if(days<=60) buckets.d31+=b;
      else buckets.d61+=b;
    });
    var total=buckets.current+buckets.d1+buckets.d31+buckets.d61 || 1;
    return {
      a:Math.round((buckets.current/total)*100),
      b:Math.round(((buckets.current+buckets.d1)/total)*100),
      c:Math.round(((buckets.current+buckets.d1+buckets.d31)/total)*100),
      buckets:buckets
    };
  }
  function item29(title,meta,badgeHtml,actionHtml){
    return '<div class="cc291-item"><div><strong>'+title+'</strong><div class="meta">'+(meta||"")+'</div></div><div class="cc291-item-actions">'+(badgeHtml||"")+(actionHtml||"")+'</div></div>';
  }
  function section29(title,items,empty){
    return '<div class="cc291-card"><h3>'+title+'</h3><div class="cc291-list">'+(items.length?items.join(""):'<div class="cc291-empty">'+(empty||"No action items.")+'</div>')+'</div></div>';
  }

  views.dashboard=function(){

      });
      var stockItems=d.lowStock.slice(0,5).map(function(i){

      });
      var opsItems=d.upcoming.slice(0,5).map(function(e){
        return item29((e.date||'')+' '+(e.time||'')+' · '+(e.customer||''),(e.service||'')+' · '+(e.assigned||'Field Team'),'<span class="badge bg-blue">Scheduled</span>','<button class="btn micro secondary" onclick="openCalendarForm(\''+e.id+'\')">Open</button>');
      });

      return '<div class="cc291-wrap">'+
        '<div class="cc291-hero"><div class="cc291-hero-inner"><div><h2>Command Center</h2><p>Executive view of revenue, collections, operations, inventory risk and action items.</p></div><div class="cc291-actions"><button class="btn" onclick="openQuickInvoice()">+ Invoice</button><button class="btn" onclick="openQuickCalendar()">+ Schedule</button><button class="btn secondary" onclick="navigate(\'payments\')">Payments</button><button class="btn secondary" onclick="navigate(\'reports\')">Reports</button></div></div></div>'+
        '<div class="cc291-top"><div class="cc291-grid">'+
          kpi29("Sales",money29(d.sales),"Invoice total","invoices")+
          kpi29("Collected",money29(d.collected),"Payments received","payments")+

        '</div><div class="cc291-health"><div class="cc291-health-row"><div><h3>Business Health Score</h3><p>Calculated from overdue AR, completed jobs without invoice, inventory risk, open AR and quote backlog.</p></div><div class="cc291-score-ring" style="--score:'+d.score+';--score-color:'+color+'"><span>'+d.score+'</span></div></div></div></div>'+
        '<div class="cc291-charts">'+

    var s=String((r&&r.status)||'').toLowerCase();

    };

      if(!Array.isArray(db.catalogs[k]) || !db.catalogs[k].length) db.catalogs[k]=defaults[k];
    });
  }

      db.teams=[

    var s=String(j.status||'').toLowerCase();

  function field31(id,label,value,type){
    if(type==='textarea')return '<div class="fg span-2"><label>'+label+'</label><textarea id="'+id+'">'+(value||'')+'</textarea></div>';
    if(type==='number')return '<div class="fg"><label>'+label+'</label><input id="'+id+'" type="number" step="0.01" value="'+(value||0)+'"></div>';
