(function(){
  var menuPatchRunning=false;

  function getSidebar(){
    return document.getElementById('sdsk') ||
           document.querySelector('aside') ||
           document.querySelector('.sidebar') ||
           document.querySelector('[class*="sidebar"]') ||
           document.querySelector('[class*="side"]');
  }

  function moduleExists(side,module){
    if(!side) return false;
    return !!side.querySelector('[data-persist-module="'+module+'"], [data-module="'+module+'"]');
  }

  function makeItem(module,icon,label){
    var item=document.createElement('div');
    item.className='nav-item menu-persist-item';
    item.setAttribute('data-module',module);
    item.setAttribute('data-persist-module',module);
    item.setAttribute('role','button');
    item.innerHTML='<span class="mini-icon">'+icon+'</span><span>'+label+'</span>';
    item.onclick=function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      navigate(module);
      setTimeout(ensureMenuItems,0);
      setTimeout(ensureMenuItems,150);
    };
    return item;
  }

  function findAnchor(side,labels){
    var found=null;
    if(!side) return null;
    Array.from(side.querySelectorAll('[data-module], [data-persist-module], div, button, a')).forEach(function(el){
      var txt=(el.textContent||'').trim().toLowerCase();
      var mod=(el.getAttribute('data-module')||el.getAttribute('data-persist-module')||'').toLowerCase();
      labels.forEach(function(l){
        var ll=l.toLowerCase();
        if(mod===ll || txt.indexOf(ll)>=0) found=el;
      });
    });
    return found;
  }

  function ensureMenuItems(){
    if(menuPatchRunning) return;
    menuPatchRunning=true;
    try{
      var side=getSidebar();
      if(!side) return;

      if(!moduleExists(side,'employees')){
        var emp=makeItem('employees','👷','Employees');
        var inventory=findAnchor(side,['inventory','inventario']);
        if(inventory && inventory.parentNode) inventory.parentNode.insertBefore(emp, inventory.nextSibling);
        else side.appendChild(emp);
      }

      if(!moduleExists(side,'teams')){
        var teams=makeItem('teams','👥','Teams / Crews');
        var empAnchor=findAnchor(side,['employees','empleados']);
        if(empAnchor && empAnchor.parentNode) empAnchor.parentNode.insertBefore(teams, empAnchor.nextSibling);
        else side.appendChild(teams);
      }

      Array.from(side.querySelectorAll('[data-persist-module]')).forEach(function(el){
        var mod=el.getAttribute('data-persist-module');
        if(window.state && state.module===mod) el.classList.add('active');
        else el.classList.remove('active');
      });
    }catch(e){

    }finally{
      menuPatchRunning=false;
    }
  }

  function scheduleMenuPatch(){
    setTimeout(ensureMenuItems,0);
    setTimeout(ensureMenuItems,80);
    setTimeout(ensureMenuItems,200);
    setTimeout(ensureMenuItems,500);
  }
  if(typeof prevRender==='function'){
  }

  var prevNavigate=window.navigate;
  if(typeof prevNavigate==='function'){
    window.navigate=function(module){
      prevNavigate(module);
      scheduleMenuPatch();
    };
  }

  document.addEventListener('click',function(e){
    var txt=(e.target && e.target.textContent || '').toLowerCase();
    var cls=(e.target && e.target.className || '').toString().toLowerCase();
    var id=(e.target && e.target.id || '').toLowerCase();

    if(
      txt.indexOf('collapse')>=0 ||
      txt.indexOf('expand')>=0 ||
      cls.indexOf('collapse')>=0 ||
      cls.indexOf('hamb')>=0 ||
      cls.indexOf('menu')>=0 ||
      id.indexOf('collapse')>=0 ||
      id.indexOf('hamb')>=0 ||
      id.indexOf('menu')>=0
    ){
      scheduleMenuPatch();
    }
  },true);

  function installObserver(){
    var side=getSidebar();
    if(!side) return;
    try{
      var obs=new MutationObserver(function(){
        scheduleMenuPatch();
      });
      obs.observe(side,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
    }catch(e){

    }
  }

  document.addEventListener('DOMContentLoaded',function(){
    scheduleMenuPatch();
    setTimeout(installObserver,300);
    setTimeout(scheduleMenuPatch,1000);
  });

  setTimeout(scheduleMenuPatch,100);
  setTimeout(installObserver,500);
})();

(function(){
  function todayStr(){ try { return today(0); } catch(e) { return new Date().toISOString().slice(0,10); } }
  function addDays(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

  function isActive(r){
    var s=String((r&&r.status)||'').toLowerCase();
    if(typeof isArchivedLike==='function' && isArchivedLike(r)) return false;
    return !s.includes('inactive') && !s.includes('cancel') && !s.includes('void') && !s.includes('archiv');

  function toast(msg){
    var old=document.querySelector('.ftv-toast');
    if(old) old.remove();
    var d=document.createElement('div');

  }
  function getJob(id){ return rows('jobs').find(function(j){ return j.id===id; }) || null; }
  function ensureJob(job){

      job.checklist=[
        {id:'CHK1',text:'Arrive on site / Llegar al sitio',done:false},
        {id:'CHK2',text:'Confirm service scope / Confirmar alcance',done:false},
        {id:'CHK3',text:'Complete cleaning tasks / Completar limpieza',done:false},
        {id:'CHK4',text:'Final walkthrough / Revisión final',done:false}
      ];
    }
    if(!Array.isArray(job.fieldPhotos)) job.fieldPhotos=[];
    if(!job.fieldNotes) job.fieldNotes=job.notes||'';
  }
  function pct(job){
    ensureJob(job);
    var total=(job.checklist||[]).length || 1;
    var done=(job.checklist||[]).filter(function(x){ return x.done; }).length;
    return Math.round((done/total)*100);
  }
  function users(){

  function jobsFor(user,range){
    var t=today(0), n7=addDays(7);

           document.querySelector('[class*="side"]');

    if(!side) return false;

  function makeFieldItem(){
    var item=document.createElement('div');
    item.className='nav-item ftv-menu-persist';

    item.onclick=function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      openFieldTeamView();
      scheduleFieldMenuPatch();
    };
    return item;
  }

  function findAnchor(side){
    if(!side) return null;
    var found=null;
    Array.from(side.querySelectorAll('[data-module], [data-persist-module], div, button, a')).forEach(function(el){
      var txt=(el.textContent||'').toLowerCase();
      var mod=(el.getAttribute('data-module')||el.getAttribute('data-persist-module')||'').toLowerCase();
      if(mod==='teams' || txt.indexOf('teams')>=0 || txt.indexOf('crews')>=0 || txt.indexOf('employees')>=0 || txt.indexOf('empleados')>=0){
        found=el;
      }
    });
    return found;
  }

  function ensureFieldMenu(){
    try{
      var side=getSidebar();
      if(!side || hasFieldMenu(side)) return;

      var item=makeFieldItem();
      var anchor=findAnchor(side);
      if(anchor && anchor.parentNode){
        anchor.parentNode.insertBefore(item, anchor.nextSibling);
      }else{
        side.appendChild(item);
      }

      if(window.state && state.module==='fieldTeam') item.classList.add('active');
    }catch(e){

    }
  }

  function scheduleFieldMenuPatch(){
    setTimeout(ensureFieldMenu,0);
    setTimeout(ensureFieldMenu,100);
    setTimeout(ensureFieldMenu,300);
    setTimeout(ensureFieldMenu,700);
  }

  try{
    if(typeof navItems!=='undefined' && Array.isArray(navItems) && !navItems.some(function(x){return x[0]==='fieldTeam'})){
      var idx=navItems.findIndex(function(x){return x[0]==='teams'});
      navItems.splice(idx>=0?idx+1:navItems.length,0,['fieldTeam','📱']);

        if(roleModules[r] && !roleModules[r].includes('fieldTeam')) roleModules[r].push('fieldTeam');
      });
    }
    if(typeof translations!=='undefined'){
      if(translations.en){translations.en.fieldTeam='Field Team View';translations.en.fieldTeamSub='Mobile jobs, check-in, checklist and completion';}
      if(translations.es){translations.es.fieldTeam='Vista Equipo Campo';translations.es.fieldTeamSub='Trabajos móviles, check-in, checklist y cierre';}
    }
  }catch(e){}
  if(typeof prevRender==='function'){
  }

  var prevNavigate=window.navigate;
  if(typeof prevNavigate==='function'){
    window.navigate=function(module){
      prevNavigate(module);
      scheduleFieldMenuPatch();
    };
  }

  document.addEventListener('click',function(){
    scheduleFieldMenuPatch();
  },true);

  function installObserver(){
    var side=getSidebar();
    if(!side) return;
    try{
      var obs=new MutationObserver(function(){scheduleFieldMenuPatch();});
      obs.observe(side,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
    }catch(e){}
  }

  var prevDashboard=views.dashboard;
  views.dashboard=function(){
    var html=prevDashboard?prevDashboard():'';
    var strip='<div class="field-access-strip"><div><strong>Field Team View:</strong> Mobile view for today jobs, check-in, checklist, photos, notes and completion.</div><button class="btn small" onclick="openFieldTeamView()">Open Field Team View</button></div>';
    scheduleFieldMenuPatch();
    return strip+html;
  };

  document.addEventListener('DOMContentLoaded',function(){
    scheduleFieldMenuPatch();
    setTimeout(installObserver,300);
  });
  scheduleFieldMenuPatch();
  setTimeout(installObserver,500);
})();

(function(){
  function todayStr(){ try { return today(0); } catch(e) { return new Date().toISOString().slice(0,10); } }
  function addDays(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
  function cname(id){ try { return customerName(id)||id||''; } catch(e) { return id||''; } }
  function sname(id){ try { return serviceName(id)||id||''; } catch(e) { return id||''; } }
  function jdate(j){ return j.date || j.job_date || ''; }
  function inactive(r){
    var s=String((r&&r.status)||'').toLowerCase();
    if(typeof isArchivedLike==='function' && isArchivedLike(r)) return true;
    return s.includes('inactive') || s.includes('cancel') || s.includes('void') || s.includes('archiv');
  }
  function isDone(s){
    s=String(s||'').toLowerCase();
    return s.includes('completed') || s==='done' || s==='invoiced';
  }
  function badgeSafe(s){
    try { return badge(s||'Active'); } catch(e) { return `<span class="badge bg-blue">${s||'Active'}</span>`; }
  }
  function jobById(id){ return rows('jobs').find(function(j){ return j.id===id; }) || null; }
  function employeeById(id){ return rows('employees').find(function(e){ return e.id===id; }) || null; }
  function employeeName(id){ var e=employeeById(id); return e ? e.name : id; }
  function activeEmployees(){ return rows('employees').filter(function(e){ return !inactive(e); }); }
  function activeJobs(){ return rows('jobs').filter(function(j){ return !inactive(j); }); }

  function ensureAssignments(){
    if(!Array.isArray(db.jobAssignments)) db.jobAssignments=[];
    var created=false;
    activeJobs().forEach(function(job){
      var existing=db.jobAssignments.filter(function(a){ return a.jobId===job.id && String(a.status||'Assigned')!=='Removed'; });
      if(existing.length) return;
      var emps=activeEmployees().filter(function(e){ return e.team===job.team; }).slice(0,2);
      emps.forEach(function(e,idx){
        db.jobAssignments.push({
          id:uid('ASN'),
          jobId:job.id,
          employeeId:e.id,
          team:job.team||e.team||'Unassigned',
          roleOnJob:idx===0?'Lead':'Technician',
          status:'Assigned',
          assignedAt:new Date().toISOString(),
          notes:'Auto-seeded demo assignment'
        });
        created=true;
      });
    });
    if(created) save(db);
  }

  function assignmentsForJob(jobId){
    ensureAssignments();
    return rows('jobAssignments').filter(function(a){ return a.jobId===jobId && String(a.status||'Assigned')!=='Removed'; });
  }
  function employeesForJob(jobId){
    return assignmentsForJob(jobId).map(function(a){ return employeeById(a.employeeId); }).filter(Boolean);
  }
  function fieldUsers(){
    var u=activeEmployees().map(function(e){
      var r=String(e.role||'').toLowerCase();
      var appRole=(r.includes('supervisor') || r.includes('lead')) ? 'Supervisor' : 'Field Employee';
      return {id:e.id,label:e.name+' — '+appRole,employeeId:e.id,employee:e,team:e.team,appRole:appRole};
    });
    u.unshift({id:'admin',label:'Admin — Full Access',employeeId:null,employee:null,team:null,appRole:'Admin'});
    return u;
  }
  function selectedFieldUser(){
    var all=fieldUsers();
    var id=(state && (state.fieldUserV323 || state.fieldUserStable || state.fieldUserId)) || 'admin';
    return all.find(function(u){ return u.id===id; }) || all[0];
  }
  function visibleToUser(job,user){
    if(!user || user.appRole==='Admin') return true;
    if(user.appRole==='Supervisor') return job.team===user.team;
    return assignmentsForJob(job.id).some(function(a){ return a.employeeId===user.employeeId; });
  }
  function jobsForUser(user,range){
    var t=today(0), n7=addDays(7);
    return activeJobs().filter(function(j){
      if(!visibleToUser(j,user)) return false;
      var d=jdate(j);
      if(range==='today') return d===t;
      if(range==='next7') return d>=t && d<=n7;
      return true;
    }).sort(function(a,b){ return (jdate(a)+(a.time||'')).localeCompare(jdate(b)+(b.time||'')); });

    return !s.includes('inactive') && !s.includes('cancel') && !s.includes('void') && !s.includes('archiv');
  }
  function optionRows(arr,valKey,labelFn,selected){
    return arr.map(function(x){

    }).join('');

    return Object.keys(names).map(function(n){ return {id:n,name:n,status:'Active'}; });

  function teamNameFromSelection(val){
    var t=activeTeams().find(function(x){ return x.id===val || x.name===val; });

  window.saveNewJobFlow=function(){

    var customerId=document.getElementById('job34-customer').value;

    var notes=document.getElementById('job34-notes').value || '';

      checkIn:null,
      checkOut:null,

      checklist:[

      status:status,
      notes:notes,

    db.jobs.unshift(job);

  window.openContractorPaymentForm=function(id){
    ensureContractorData();
    var opts=contractors().map(function(c){return `<option value="${c.id}" ${id===c.id?'selected':''}>${c.name}</option>`;}).join('');
    var body=`<div class="form-grid">
      <div class="fg"><label>Contractor</label><select id="cpay-employee">${opts}</select></div>
      <div class="fg"><label>Date</label><input id="cpay-date" type="date" value="${today(0)}"></div>
      <div class="fg"><label>Amount</label><input id="cpay-amount" type="number" step="0.01" value="0"></div>
      <div class="fg"><label>Method</label><input id="cpay-method" value="ACH / Check"></div>
      <div class="fg"><label>Reference</label><input id="cpay-ref" value=""></div>
      <div class="fg span-2"><label>Notes</label><textarea id="cpay-notes"></textarea></div>
    </div>`;
    openModal('Add Contractor Payment',body,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" data-c1099-action="save-payment">Save Payment</button>');
  };

  window.saveContractorPayment=function(){
    if(!Array.isArray(db.contractorPayments))db.contractorPayments=[];
    var rec={id:uid('CPAY'),employeeId:document.getElementById('cpay-employee').value,date:document.getElementById('cpay-date').value||today(0),amount:+document.getElementById('cpay-amount').value||0,method:document.getElementById('cpay-method').value||'',reference:document.getElementById('cpay-ref').value||'',notes:document.getElementById('cpay-notes').value||''};
    db.contractorPayments.unshift(rec);
    try{log('contractorPayments','Create',null,rec);}catch(e){}
    save(db);closeModal();requestAnimationFrame(()=>navigate('contractors1099', true));
  };

  window.exportContractor1099Mock=function(){
    ensureContractorData();
    var lines=['Legal Name,Employee ID,W9 Received,Tax ID Last 4,YTD Paid,1099 Required,Notes'];
    contractors().forEach(function(e){
      var p=e.contractorProfile||{}, paid=ytdPaid(e.id);
      lines.push(['"'+(p.legalName||e.name)+'"',e.id,p.w9Received?'Yes':'No',p.taxIdLast4||'',paid.toFixed(2),paid>=600?'Yes':'No','"'+(p.accountantNotes||'')+'"'].join(','));
    });
    var blob=new Blob([lines.join('\\n')],{type:'text/csv'}), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download='BRUNO360_1099_Contractor_Export_Mock.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  };

  views.contractors1099=function(){
    ensureContractorData();
    var list=contractors(), missing=list.filter(function(e){return !(e.contractorProfile&&e.contractorProfile.w9Received);}).length, threshold=list.filter(function(e){return ytdPaid(e.id)>=600;}).length, total=list.reduce(function(a,e){return a+ytdPaid(e.id);},0);
    var rowsHtml=list.map(function(e){
      var p=e.contractorProfile||{}, paid=ytdPaid(e.id), st=contractorStatus(e);
      return `<div class="c1099-row"><div><strong>${p.legalName||e.name}</strong><div class="c1099-meta">${e.role||''} · ${e.team||''} · ${e.employmentType||'Contractor / 1099'}<br>Payment: ${p.paymentMethod||e.payType||''} · Tax ID Last 4: ${p.taxIdLast4||'Missing'}</div><div class="c1099-tags">${badgeH(st.label,st.cls)}${badgeH('YTD '+money(paid),'bg-blue')}${p.w9Received?badgeH('W-9 Received','bg-green'):badgeH('Missing W-9','bg-red')}</div></div><div class="c1099-buttons"><button class="btn small" onclick="openContractorProfile('${e.id}')">Profile</button><button class="btn small secondary" onclick="openContractorPaymentForm('${e.id}')">Add Payment</button></div></div>`;
    }).join('') || '<div class="c1099-note">No 1099 contractors found. Set an employee Employment Type to Contractor / 1099.</div>';
    return `<div class="c1099-hero"><div class="c1099-top"><div><h2>Contractors / 1099</h2><p>Track contractors, W-9 status, YTD payments and 1099 threshold readiness without storing full sensitive tax IDs.</p></div><div class="c1099-actions"><button class="btn" onclick="openContractorPaymentForm()">+ Contractor Payment</button><button class="btn secondary" onclick="exportContractor1099Mock()">Export Mock CSV</button><button class="btn secondary" onclick="navigate('employees')">Employees</button></div></div></div>
      <div class="c1099-note"><strong>Important:</strong> This is tracking only. It does not replace accounting, payroll, tax filing, QuickBooks, Gusto, ADP or a CPA.</div>
      <div class="c1099-grid"><div class="c1099-kpi"><div class="label">Active Contractors</div><div class="value">${list.length}</div><div class="hint">1099 records</div></div><div class="c1099-kpi"><div class="label">Missing W-9</div><div class="value">${missing}</div><div class="hint">Needs follow-up</div></div><div class="c1099-kpi"><div class="label">1099 Threshold Met</div><div class="value">${threshold}</div><div class="hint">$600+ paid YTD</div></div><div class="c1099-kpi"><div class="label">YTD Contractor Paid</div><div class="value">${money(total)}</div><div class="hint">Demo payments</div></div></div>
      <div class="c1099-secure-note"><strong>Production security:</strong> Full SSN/EIN, W-9 documents and bank details must be stored only with real authentication, strict role access, encryption/storage controls and audit logging.</div>
      <div class="c1099-card"><h3>Contractor Tracking Board</h3>${rowsHtml}</div>`;
  };

  document.addEventListener('click',function(e){
    var btn=e.target && e.target.closest ? e.target.closest('[data-c1099-action]') : null;
    if(!btn) return;
    var action=btn.getAttribute('data-c1099-action');
    var id=btn.getAttribute('data-contractor-id');
    e.preventDefault();e.stopPropagation();
    if(action==='edit') openContractorEditForm(id);
    if(action==='save-profile') saveContractor1099(id);
    if(action==='save-payment') saveContractorPayment();
  },true);

  function addContractorSidebar(){  }

  try{
    if(typeof navItems!=='undefined'&&Array.isArray(navItems)&&!navItems.some(function(x){return x[0]==='contractors1099'})){
      var idx=navItems.findIndex(function(x){return x[0]==='employees';});navItems.splice(idx>=0?idx+1:navItems.length,0,['contractors1099','🧾']);
    }
    Object.keys(roleModules).forEach(function(r){if(roleModules[r]&&!roleModules[r].includes('contractors1099')&&r!=='Field Team')roleModules[r].push('contractors1099');});
    if(translations&&translations.en){translations.en.contractors1099='Contractors / 1099';translations.en.contractors1099Sub='W-9, YTD paid and 1099 tracking';}
    if(translations&&translations.es){translations.es.contractors1099='Contratistas / 1099';translations.es.contractors1099Sub='W-9, pagos YTD y seguimiento 1099';}
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){setTimeout(addContractorSidebar,300);});
  document.addEventListener('click',function(){setTimeout(addContractorSidebar,250);},true);

  var oldDash=views.dashboard;
  if(typeof oldDash==='function'){
    views.dashboard=function(){
      ensureContractorData();
      var html=oldDash(), list=contractors(), missing=list.filter(function(e){return !(e.contractorProfile&&e.contractorProfile.w9Received);}).length, threshold=list.filter(function(e){return ytdPaid(e.id)>=600;}).length, total=list.reduce(function(a,e){return a+ytdPaid(e.id);},0);
      var extra=`<div class="c1099-grid"><div class="c1099-kpi" onclick="navigate('contractors1099')" style="cursor:pointer"><div class="label">Active Contractors</div><div class="value">${list.length}</div><div class="hint">1099 tracked</div></div><div class="c1099-kpi" onclick="navigate('contractors1099')" style="cursor:pointer"><div class="label">Missing W-9</div><div class="value">${missing}</div><div class="hint">Needs follow-up</div></div><div class="c1099-kpi" onclick="navigate('contractors1099')" style="cursor:pointer"><div class="label">1099 Threshold Met</div><div class="value">${threshold}</div><div class="hint">$600+ YTD</div></div><div class="c1099-kpi" onclick="navigate('contractors1099')" style="cursor:pointer"><div class="label">Contractor YTD Paid</div><div class="value">${money(total)}</div><div class="hint">Demo tracking</div></div></div>`;
      return html.replace('<div class="cc291-charts">',extra+'<div class="cc291-charts">');
    };
  }
  ensureContractorData();
})();

init();
</script>
</body>
</html>
